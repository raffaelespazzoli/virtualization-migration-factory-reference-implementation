apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cluster-api-certs
  namespace: openshift-config 
spec:
  secretName: cluster-api-certs-tls
  duration: 168h0m0s
  renewBefore: 1h0m0s
  commonName: 'api.${CLUSTER_BASE_DOMAIN}'
  usages:
    - server auth
  # At least one of a DNS Name, URI, or IP address is required.
  dnsNames:
    - 'api.${CLUSTER_BASE_DOMAIN}'
  issuerRef:
    name: platform-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io