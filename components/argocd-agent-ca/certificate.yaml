apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-agent-root-ca
spec:
  isCA: true
  commonName: ArgoCD Agent Root CA
  secretName: argocd-agent-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: argocd-agent-selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "argocd-agent-principal"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "argocd-agent-principal"
  subject:
    organizations:
      - ETL Lab
  usages:
    - crl sign
    - cert sign
    - signing
    - digital signature
