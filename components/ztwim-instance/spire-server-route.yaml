apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: spire-server
  annotations:
    haproxy.router.openshift.io/timeout: 3600s
spec:
  host: spire-server.apps.${CLUSTER_BASE_DOMAIN}
  port:
    targetPort: grpc
  tls:
    termination: passthrough
  to:
    kind: Service
    name: spire-server
    weight: 100
