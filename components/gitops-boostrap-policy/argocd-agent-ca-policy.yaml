apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: argocd-agent-ca-policy
  namespace: acm-policies
spec:
  remediationAction: enforce
  disabled: false
  hubTemplateOptions:
    serviceAccountName: policy-admin
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: argocd-agent-ca-policy
        spec:
          remediationAction: enforce
          severity: low
          object-templates-raw: |-
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: argocd-agent-ca
                  namespace: 'openshift-gitops'
                type: kubernetes.io/tls
                data:
                  tls.crt: {{hub (index (lookup "v1" "Secret" "openshift-gitops" "argocd-agent-ca").data "tls.crt") hub}}
                  tls.key: {{hub (index (lookup "v1" "Secret" "openshift-gitops" "argocd-agent-ca").data "tls.key") hub}}
                  ca.crt: {{hub (index (lookup "v1" "Secret" "openshift-gitops" "argocd-agent-ca").data "ca.crt") hub}}
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: argocd-agent-ca-cert
                  namespace: 'openshift-gitops'
                type: kubernetes.io/tls
                data:
                  ca.crt: {{hub (index (lookup "v1" "Secret" "openshift-gitops" "argocd-agent-ca").data "ca.crt") hub}}
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: argocd-agent-ca-placement
  namespace: acm-policies
spec:
  clusterSets:
  - global
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            gitops: deploy
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: argocd-agent-ca-binding
  namespace: acm-policies
subjects:
  - kind: Policy
    apiGroup: policy.open-cluster-management.io
    name: argocd-agent-ca-policy
placementRef:
  kind: Placement
  apiGroup: cluster.open-cluster-management.io
  name: argocd-agent-ca-placement
