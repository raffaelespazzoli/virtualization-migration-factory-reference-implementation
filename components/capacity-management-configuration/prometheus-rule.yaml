# Capacity accounting for OpenShift Virtualization.
#
# Only nodes labeled kubevirt.io/schedulable=true are counted. That drops
# nodes KubeVirt will not schedule virtual machines onto.
#
# capacity:nodes_down:count is the HA reserve: the largest schedulable node's
# allocatable, multiplied by this count, is subtracted from total capacity.
# Default is 1 (keep headroom for a single node failure). Change that rule
# to reserve a different number of nodes.
#
# Metric names use underscores and a unit suffix. Prometheus metric names
# cannot contain hyphens.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: capacity-management
  namespace: openshift-monitoring
  labels:
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: capacity-management.rules
      rules:
        - record: capacity:nodes_down:count
          expr: vector(1)

        # Memory. kube-state-metrics reports resource="memory" in bytes.
        - record: cluster:total_capacity_memory:bytes
          expr: |
            sum(
              kube_node_status_allocatable{resource="memory"}
              and on(node) kube_node_labels{label_kubevirt_io_schedulable="true"}
            )
            -
            (
              max(
                kube_node_status_allocatable{resource="memory"}
                and on(node) kube_node_labels{label_kubevirt_io_schedulable="true"}
              )
              * capacity:nodes_down:count
            )
        - record: cluster:used_capacity_memory:bytes
          expr: |
            sum(
              kube_pod_resource_request{resource="memory"}
              and on(node) kube_node_labels{label_kubevirt_io_schedulable="true"}
            )
            or vector(0)
        - record: cluster:available_capacity_memory:bytes
          expr: cluster:total_capacity_memory:bytes - cluster:used_capacity_memory:bytes
        # VM and non-VM requests are limited to kubevirt-schedulable nodes, same
        # as cluster:used_capacity_memory:bytes. The two are a partition of used,
        # so VM + non-VM + available = total.
        - record: cluster:vm_used_capacity_memory:bytes
          expr: |
            sum(
              kube_pod_resource_request{resource="memory",pod=~"virt-launcher-.*"}
              and on(node) kube_node_labels{label_kubevirt_io_schedulable="true"}
            )
            or vector(0)
        - record: cluster:non_vm_used_capacity_memory:bytes
          expr: |
            sum(
              kube_pod_resource_request{resource="memory",pod!~"virt-launcher-.*"}
              and on(node) kube_node_labels{label_kubevirt_io_schedulable="true"}
            )
            or vector(0)

        # CPU. kube-state-metrics reports resource="cpu" in cores.
        - record: cluster:total_capacity_cpu:cores
          expr: |
            sum(
              kube_node_status_allocatable{resource="cpu"}
              and on(node) kube_node_labels{label_kubevirt_io_schedulable="true"}
            )
            -
            (
              max(
                kube_node_status_allocatable{resource="cpu"}
                and on(node) kube_node_labels{label_kubevirt_io_schedulable="true"}
              )
              * capacity:nodes_down:count
            )
        - record: cluster:used_capacity_cpu:cores
          expr: |
            sum(
              kube_pod_resource_request{resource="cpu"}
              and on(node) kube_node_labels{label_kubevirt_io_schedulable="true"}
            )
            or vector(0)
        - record: cluster:available_capacity_cpu:cores
          expr: cluster:total_capacity_cpu:cores - cluster:used_capacity_cpu:cores
        - record: cluster:vm_used_capacity_cpu:cores
          expr: |
            sum(
              kube_pod_resource_request{resource="cpu",pod=~"virt-launcher-.*"}
              and on(node) kube_node_labels{label_kubevirt_io_schedulable="true"}
            )
            or vector(0)
        - record: cluster:non_vm_used_capacity_cpu:cores
          expr: |
            sum(
              kube_pod_resource_request{resource="cpu",pod!~"virt-launcher-.*"}
              and on(node) kube_node_labels{label_kubevirt_io_schedulable="true"}
            )
            or vector(0)

        # GiB of memory request per CPU request. Nodes with this memory-to-CPU
        # ratio match the current workload, so neither resource is stranded.
        - record: cluster:memory_cpu_ratio:gib_per_core
          expr: |
            cluster:used_capacity_memory:bytes
            / (1024 * 1024 * 1024)
            / scalar(cluster:used_capacity_cpu:cores)

        # Actual usage from kubelet cAdvisor, as opposed to the request-based
        # capacity rules above. container!="" and container!="POD" skip the
        # pod cgroup aggregate and the pause container so they are not counted
        # twice.
        #
        # Memory is a gauge. CPU is the counter container_cpu_usage_seconds_total;
        # rate() turns it into cores. cpu="total" is the per-container aggregate
        # cAdvisor emits alongside one series per core — without it the sum
        # counts every core on top of the total.
        - record: cluster:vm_memory_usage:bytes
          expr: |
            sum(container_memory_working_set_bytes{pod=~"virt-launcher-.*",container!="",container!="POD"})
            or vector(0)
        - record: cluster:non_vm_memory_usage:bytes
          expr: |
            sum(container_memory_working_set_bytes{pod!~"virt-launcher-.*",container!="",container!="POD"})
            or vector(0)
        - record: cluster:vm_cpu_usage:cores
          expr: |
            sum(rate(container_cpu_usage_seconds_total{pod=~"virt-launcher-.*",container!="",container!="POD",cpu="total"}[5m]))
            or vector(0)
        - record: cluster:non_vm_cpu_usage:cores
          expr: |
            sum(rate(container_cpu_usage_seconds_total{pod!~"virt-launcher-.*",container!="",container!="POD",cpu="total"}[5m]))
            or vector(0)

        # ── VM overcommit statistical aggregates ─────────────────────
        # Cluster-wide aggregate of actual VM resource usage, recorded
        # as time series so that stddev_over_time() and quantile_over_time()
        # subqueries read from TSDB instead of re-evaluating the sum at
        # every step across the observation window.
        #
        # These use KubeVirt guest-level metrics (not cAdvisor) to match
        # the overcommit dashboard's notion of "actual VM usage."
        - record: cluster:vm_memory_actual_used:bytes
          expr: sum(kubevirt_vmi_memory_used_bytes) or vector(0)
        - record: cluster:vm_cpu_actual_used:cores
          expr: |
            sum(rate(kubevirt_vmi_cpu_usage_seconds_total[5m])) or vector(0)

    # Per-VM virt-launcher overhead: cAdvisor usage of the virt-launcher pod
    # minus QEMU/domain usage reported by kubevirt_vmi_*. The join maps
    # virt-launcher pod → VM name via kube_pod_info.created_by_name.
    # Memory uses resident guest RSS so the subtraction is actual RAM, not
    # configured domain size. CPU uses rate() on both counters.
    - name: virt-launcher-overhead.rules
      rules:
        - record: vmi:virt_launcher_overhead_memory:bytes
          expr: |
            sum by (namespace, name, node) (
              container_memory_working_set_bytes{pod=~"virt-launcher-.*", container!="", container!="POD"}
              * on(namespace, pod) group_left(name)
                label_replace(
                  kube_pod_info{created_by_kind="VirtualMachineInstance", pod=~"virt-launcher-.*"},
                  "name", "$1", "created_by_name", "(.*)"
                )
            )
            -
            sum by (namespace, name, node) (
              kubevirt_vmi_memory_resident_bytes
            )
        - record: vmi:virt_launcher_overhead_cpu:cores
          expr: |
            sum by (namespace, name, node) (
              rate(container_cpu_usage_seconds_total{pod=~"virt-launcher-.*",container!="",container!="POD",cpu="total"}[5m])
              * on(namespace, pod) group_left(name)
                label_replace(
                  kube_pod_info{created_by_kind="VirtualMachineInstance",pod=~"virt-launcher-.*"},
                  "name", "$1", "created_by_name", "(.*)"
                )
            )
            -
            sum by (namespace, name, node) (
              rate(kubevirt_vmi_cpu_usage_seconds_total[5m])
            )

    # Time-to-exhaustion rules. deriv() computes the least-squares slope of
    # available capacity over a lookback window. When the slope is negative
    # (capacity shrinking), -available/slope gives seconds until zero;
    # dividing by 86400 converts to days. When the slope is zero or positive
    # (capacity stable or growing), the result is +Inf — the cluster never
    # runs out. Four observation windows trade off responsiveness against
    # noise: 7d reacts fast but is noisy; 360d is a long-range planning
    # view that requires matching retention.
    - name: capacity-exhaustion.rules
      rules:
        # --- 7-day window ---------------------------------------------------
        - record: cluster:days_to_exhaustion_memory_7d:days
          expr: |
            (
              (
                - cluster:available_capacity_memory:bytes
                  / deriv(cluster:available_capacity_memory:bytes[7d])
                and
                deriv(cluster:available_capacity_memory:bytes[7d]) < 0
              )
              or vector(+Inf)
            ) / 86400
        - record: cluster:days_to_exhaustion_cpu_7d:days
          expr: |
            (
              (
                - cluster:available_capacity_cpu:cores
                  / deriv(cluster:available_capacity_cpu:cores[7d])
                and
                deriv(cluster:available_capacity_cpu:cores[7d]) < 0
              )
              or vector(+Inf)
            ) / 86400
        - record: cluster:days_to_exhaustion_7d:days
          expr: |
            clamp_max(
              cluster:days_to_exhaustion_memory_7d:days,
              scalar(cluster:days_to_exhaustion_cpu_7d:days)
            )

        # --- 30-day window --------------------------------------------------
        - record: cluster:days_to_exhaustion_memory_30d:days
          expr: |
            (
              (
                - cluster:available_capacity_memory:bytes
                  / deriv(cluster:available_capacity_memory:bytes[30d])
                and
                deriv(cluster:available_capacity_memory:bytes[30d]) < 0
              )
              or vector(+Inf)
            ) / 86400
        - record: cluster:days_to_exhaustion_cpu_30d:days
          expr: |
            (
              (
                - cluster:available_capacity_cpu:cores
                  / deriv(cluster:available_capacity_cpu:cores[30d])
                and
                deriv(cluster:available_capacity_cpu:cores[30d]) < 0
              )
              or vector(+Inf)
            ) / 86400
        - record: cluster:days_to_exhaustion_30d:days
          expr: |
            clamp_max(
              cluster:days_to_exhaustion_memory_30d:days,
              scalar(cluster:days_to_exhaustion_cpu_30d:days)
            )

        # --- 180-day window -------------------------------------------------
        - record: cluster:days_to_exhaustion_memory_180d:days
          expr: |
            (
              (
                - cluster:available_capacity_memory:bytes
                  / deriv(cluster:available_capacity_memory:bytes[180d])
                and
                deriv(cluster:available_capacity_memory:bytes[180d]) < 0
              )
              or vector(+Inf)
            ) / 86400
        - record: cluster:days_to_exhaustion_cpu_180d:days
          expr: |
            (
              (
                - cluster:available_capacity_cpu:cores
                  / deriv(cluster:available_capacity_cpu:cores[180d])
                and
                deriv(cluster:available_capacity_cpu:cores[180d]) < 0
              )
              or vector(+Inf)
            ) / 86400
        - record: cluster:days_to_exhaustion_180d:days
          expr: |
            clamp_max(
              cluster:days_to_exhaustion_memory_180d:days,
              scalar(cluster:days_to_exhaustion_cpu_180d:days)
            )

        # --- 360-day window -------------------------------------------------
        - record: cluster:days_to_exhaustion_memory_360d:days
          expr: |
            (
              (
                - cluster:available_capacity_memory:bytes
                  / deriv(cluster:available_capacity_memory:bytes[360d])
                and
                deriv(cluster:available_capacity_memory:bytes[360d]) < 0
              )
              or vector(+Inf)
            ) / 86400
        - record: cluster:days_to_exhaustion_cpu_360d:days
          expr: |
            (
              (
                - cluster:available_capacity_cpu:cores
                  / deriv(cluster:available_capacity_cpu:cores[360d])
                and
                deriv(cluster:available_capacity_cpu:cores[360d]) < 0
              )
              or vector(+Inf)
            ) / 86400
        - record: cluster:days_to_exhaustion_360d:days
          expr: |
            clamp_max(
              cluster:days_to_exhaustion_memory_360d:days,
              scalar(cluster:days_to_exhaustion_cpu_360d:days)
            )

    # -----------------------------------------------------------------
    # Node-level runtime memory breakdown
    #
    # Memory decomposition
    # ====================
    # Every byte charged to a cgroup falls into exactly one of four
    # buckets.  The four buckets sum to container_memory_usage_bytes
    # (= memory.current) for each scope:
    #
    #   usage = non_reclaimable + cold + hot_reclaimable + overhead
    #
    #   non_reclaimable  = container_memory_rss (memory.stat[anon])
    #                      Heap, stack, mmap(MAP_ANONYMOUS).
    #                      Cannot be freed without swap — this is
    #                      what ultimately causes OOM kills.
    #
    #   cold             = container_memory_total_inactive_file_bytes
    #                      (memory.stat[inactive_file])
    #                      File cache the kernel considers "cold."
    #                      Reclaimed first, cheapest to free.
    #
    #   hot_reclaimable  = container_memory_total_active_file_bytes
    #                      (memory.stat[active_file])
    #                      File cache recently accessed.  The kernel
    #                      CAN reclaim it under pressure but prefers
    #                      not to.  Freeing it causes re-reads from
    #                      disk (performance hit, not availability).
    #
    #   overhead         = usage − rss − inactive_file − active_file
    #                      Kernel structures charged to this cgroup:
    #                      slab, kernel_stack, sock, pagetables, etc.
    #                      Partially reclaimable (slab_reclaimable)
    #                      but cAdvisor does not break it down.
    #
    # Scopes
    # ======
    # workloads = id="/kubepods.slice"   (all pods)
    # system    = id="/system.slice"     (kubelet, CRI-O, OS daemons)
    # -----------------------------------------------------------------
    - name: capacity-management-node-memory.rules
      rules:
        # ── Utilization ratio ────────────────────────────────────────
        # Fraction of the workloads memory space (allocatable) that is
        # currently occupied.  Uses working_set (hot+warm) from the
        # kubepods.slice aggregate cgroup, which is the same metric
        # the kubelet uses for eviction decisions.
        - record: cluster:node:memory:workloads_utilization:ratio
          expr: |
            sum by (node) (
              container_memory_working_set_bytes{id="/kubepods.slice"}
            )
            / on (node)
            kube_node_status_allocatable{resource="memory"}

        # ── PSI pressure ─────────────────────────────────────────────
        # Fraction of wall-clock time at least one process was stalled
        # waiting for memory.  Root cgroup (id="/") gives node-wide
        # pressure.  Requires cgroup v2 and kernel >= 4.20.
        - record: cluster:node:memory:pressure:ratio
          expr: |
            rate(
              container_pressure_memory_waiting_seconds_total{id="/"}[5m]
            )

        # ── Workload memory breakdown ────────────────────────────────

        # Total memory charged to all pods (memory.current).
        - record: cluster:node:memory:workloads_used:bytes
          expr: |
            sum by (node) (
              container_memory_usage_bytes{id="/kubepods.slice"}
            )

        # Anonymous memory — heap, stack.  NOT reclaimable without
        # swap.  The primary driver of OOM kills.
        - record: cluster:node:memory:workloads_non_reclaimable:bytes
          expr: |
            sum by (node) (
              container_memory_rss{id="/kubepods.slice"}
            )

        # Inactive file cache — coldest pages, reclaimed first.
        - record: cluster:node:memory:workloads_cold:bytes
          expr: |
            sum by (node) (
              container_memory_total_inactive_file_bytes{id="/kubepods.slice"}
            )

        # Active file cache — recently accessed, reclaimable under
        # pressure but at a performance cost (re-read from disk).
        - record: cluster:node:memory:workloads_hot_reclaimable:bytes
          expr: |
            sum by (node) (
              container_memory_total_active_file_bytes{id="/kubepods.slice"}
            )

        # Kernel overhead — slab, kernel_stack, sock, pagetables.
        # Computed as the residual so the four parts sum to used.
        - record: cluster:node:memory:workloads_overhead:bytes
          expr: |
            sum by (node) (container_memory_usage_bytes{id="/kubepods.slice"})
            - sum by (node) (container_memory_rss{id="/kubepods.slice"})
            - sum by (node) (container_memory_total_inactive_file_bytes{id="/kubepods.slice"})
            - sum by (node) (container_memory_total_active_file_bytes{id="/kubepods.slice"})

        # Swap used by workloads.
        - record: cluster:node:memory:workloads_swap:bytes
          expr: |
            sum by (node) (
              container_memory_swap{id="/kubepods.slice"}
            )

        # ── System memory breakdown ──────────────────────────────────

        # Total memory charged to system.slice.
        - record: cluster:node:memory:system_used:bytes
          expr: |
            sum by (node) (
              container_memory_usage_bytes{id="/system.slice"}
            )

        # Anonymous memory in system.slice.
        - record: cluster:node:memory:system_non_reclaimable:bytes
          expr: |
            sum by (node) (
              container_memory_rss{id="/system.slice"}
            )

        # Inactive file cache in system.slice.
        - record: cluster:node:memory:system_cold:bytes
          expr: |
            sum by (node) (
              container_memory_total_inactive_file_bytes{id="/system.slice"}
            )

        # Active file cache in system.slice.
        - record: cluster:node:memory:system_hot_reclaimable:bytes
          expr: |
            sum by (node) (
              container_memory_total_active_file_bytes{id="/system.slice"}
            )

        # Kernel overhead in system.slice.
        - record: cluster:node:memory:system_overhead:bytes
          expr: |
            sum by (node) (container_memory_usage_bytes{id="/system.slice"})
            - sum by (node) (container_memory_rss{id="/system.slice"})
            - sum by (node) (container_memory_total_inactive_file_bytes{id="/system.slice"})
            - sum by (node) (container_memory_total_active_file_bytes{id="/system.slice"})

        # Swap used by system services.
        - record: cluster:node:memory:system_swap:bytes
          expr: |
            sum by (node) (
              container_memory_swap{id="/system.slice"}
            )

    # ── CPU Pressure (PSI) ──────────────────────────────────────────
    #
    # PSI (Pressure Stall Information) for CPU measures the fraction
    # of wall-clock time that at least one runnable task was waiting
    # for a CPU to become available.  Unlike memory and I/O, CPU PSI
    # only has a "some" flavor — there is no "full" because there is
    # always at least one task running on a CPU.
    #
    # CPU is a compressible resource: contention causes slowdowns
    # (increased scheduling latency) rather than failures (OOM kills).
    # Higher thresholds are appropriate compared to memory PSI.
    #
    # Scopes:
    #   node       = root cgroup id="/"    (all processes on the node)
    #   pod        = pod cgroup (container="", pod!="")
    #   container  = container cgroup (container!="", container!="POD")
    #   vm (guest) = kubevirt_vmi_vcpu_wait_seconds_total (vCPU wait)
    #
    # Requires cgroupv2 and kernel >= 4.20 (same as memory PSI).
    - name: capacity-management-cpu-pressure.rules
      rules:
        # Node-wide CPU pressure from the root cgroup.
        # Mirrors cluster:node:memory:pressure:ratio.
        - record: cluster:node:cpu:pressure:ratio
          expr: |
            rate(
              container_pressure_cpu_waiting_seconds_total{id="/"}[5m]
            )

        # Per-pod CPU pressure from pod-level cgroups.
        # container="" selects the pod cgroup aggregate (same
        # convention as pod:memory:working_set_utilization:ratio).
        - record: pod:cpu:pressure:ratio
          expr: |
            rate(
              container_pressure_cpu_waiting_seconds_total{container="", pod!=""}[5m]
            )

        # Per-container CPU pressure.
        - record: container:cpu:pressure:ratio
          expr: |
            rate(
              container_pressure_cpu_waiting_seconds_total{container!="", container!="POD"}[5m]
            )

        # ── VM guest: vCPU host-scheduling delay ──────────────────
        #
        # kubevirt_vmi_vcpu_delay_seconds_total is a counter that
        # accumulates the time each vCPU spent "waiting in the host
        # scheduler queue instead of running."  This is the VM-level
        # equivalent of CPU PSI: the guest was ready to run but the
        # host hadn't scheduled the vCPU onto a physical core yet.
        #
        # NOTE: Do NOT confuse with kubevirt_vmi_vcpu_wait_seconds_total
        # which measures vCPU I/O wait, not CPU scheduling delay.
        #
        # The sum aggregates across all vCPUs of a VM.  A value of
        # 1.0 means one vCPU-second of delay per wall-clock second —
        # e.g. one vCPU was fully stalled, or two vCPUs were each
        # 50% stalled.  Values > 1.0 are possible with many vCPUs.
        #
        # KubeVirt already ships guest-internal CPU saturation alerts
        # (GuestVCPUQueueHighWarning/Critical) based on guest OS load
        # vs vCPU count.  This metric captures the HOST side:
        # is the host giving this VM enough CPU time?
        - record: vmi:cpu:vcpu_delay:ratio
          expr: |
            sum by (namespace, name, node) (
              rate(kubevirt_vmi_vcpu_delay_seconds_total[5m])
            )

    # ── Network saturation ─────────────────────────────────────────
    #
    # Network bandwidth is a compressible resource: contention causes
    # throughput degradation and latency increases, not hard failures.
    # There is no PSI for networking — the kernel PSI subsystem only
    # covers cpu, memory, and io (block).
    #
    # Saturation signals:
    #   - NIC utilization vs link speed (node scope only — we know
    #     link speed from node_network_speed_bytes)
    #   - Packet drops (all scopes — valid packets discarded by the
    #     software stack because it can't keep up)
    #   - Packet errors (node/VM scope — corrupted frames on the wire,
    #     indicating physical/hardware problems)
    #
    # OpenShift's node_exporter configuration excludes bond interfaces
    # from the netdev collector (--collector.netdev.device-exclude
    # includes "bond.*").  We therefore monitor individual physical
    # NICs, which also catches bond hash-imbalance: one member NIC
    # saturated while others are idle.
    #
    # Physical NIC identification
    # ===========================
    # Instead of excluding virtual devices by name regex, we
    # positively identify physical NICs by joining with
    # node_network_info{duplex!=""}.  Physical NICs always report a
    # duplex setting from the PHY (Full, Half, or Unknown when the
    # link is down).  Virtual interfaces (lo, veth, ovs, geneve,
    # bridges) have no physical PHY and never report duplex.
    #
    # We further filter with node_network_carrier == 1 to exclude
    # NICs with no link, which also report garbage speed values.
    # The two filters together give us: physical NICs with carrier.
    - name: capacity-management-network.rules
      rules:
        # ── Node scope: per-NIC utilization vs link speed ────────
        #
        # Transmit utilization is typically the bottleneck direction
        # for servers.  We record both directions.

        # Transmit utilization: rate(tx_bytes) / speed_bytes.
        # Bounded 0–1 for a single NIC; can briefly exceed 1.0 due
        # to TSO/GSO offload counting.
        - record: cluster:node:nic:transmit_utilization:ratio
          expr: |
            (
              rate(node_network_transmit_bytes_total[5m])
            / on (instance, device)
              (node_network_speed_bytes > 0)
            )
            * on (instance, device) group_left()
              (node_network_carrier == 1)
            * on (instance, device) group_left(duplex)
              node_network_info{duplex!=""}

        # Receive utilization: rate(rx_bytes) / speed_bytes.
        - record: cluster:node:nic:receive_utilization:ratio
          expr: |
            (
              rate(node_network_receive_bytes_total[5m])
            / on (instance, device)
              (node_network_speed_bytes > 0)
            )
            * on (instance, device) group_left()
              (node_network_carrier == 1)
            * on (instance, device) group_left(duplex)
              node_network_info{duplex!=""}

        # ── Node scope: packet drop rate ─────────────────────────
        # Drops = valid packets discarded by the stack (ring buffer
        # overflow, kernel queue full, memory pressure, or firewall
        # policy).  Some baseline from policy drops is normal; a
        # sustained increase indicates saturation.
        - record: cluster:node:nic:drop_rate:packets_per_second
          expr: |
            (
              rate(node_network_receive_drop_total[5m])
            + rate(node_network_transmit_drop_total[5m])
            )
            * on (instance, device) group_left()
              (node_network_carrier == 1)
            * on (instance, device) group_left(duplex)
              node_network_info{duplex!=""}

        # ── Node scope: packet error rate ────────────────────────
        # Errors = corrupted or malformed frames on the wire (CRC
        # failures, runt/giant frames, carrier loss).  Always
        # indicates a physical/hardware problem.  Normal value is 0.
        - record: cluster:node:nic:error_rate:packets_per_second
          expr: |
            (
              rate(node_network_receive_errs_total[5m])
            + rate(node_network_transmit_errs_total[5m])
            )
            * on (instance, device) group_left()
              (node_network_carrier == 1)
            * on (instance, device) group_left(duplex)
              node_network_info{duplex!=""}

        # ── VM guest scope: per-VM network drop rate ─────────────
        # KubeVirt exports per-VM per-interface network drops.
        # Sum across interfaces for a per-VM total.
        - record: vmi:network:drop_rate:packets_per_second
          expr: |
            sum by (namespace, name, node) (
              rate(kubevirt_vmi_network_receive_packets_dropped_total[5m])
            + rate(kubevirt_vmi_network_transmit_packets_dropped_total[5m])
            )

        # ── VM guest scope: per-VM network error rate ────────────
        - record: vmi:network:error_rate:packets_per_second
          expr: |
            sum by (namespace, name, node) (
              rate(kubevirt_vmi_network_receive_errors_total[5m])
            + rate(kubevirt_vmi_network_transmit_errors_total[5m])
            )

        # ── VM guest scope: per-VM network throughput ────────────
        # Useful for dashboarding; no capacity reference exists
        # at the VM level so no utilization ratio is possible.
        - record: vmi:network:throughput:bytes_per_second
          expr: |
            sum by (namespace, name, node) (
              rate(kubevirt_vmi_network_receive_bytes_total[5m])
            + rate(kubevirt_vmi_network_transmit_bytes_total[5m])
            )

    # ── Storage I/O Pressure (PSI) ─────────────────────────────────
    #
    # PSI for I/O measures the fraction of wall-clock time that tasks
    # are stalled waiting for block I/O (reads/writes to disk, iSCSI,
    # FC, or any block device).
    #
    # Unlike CPU (which only has "some"), I/O PSI has two flavors:
    #   "some" (waiting) — at least one task stalled on I/O
    #   "full" (stalled) — ALL tasks stalled on I/O (zero progress)
    #
    # "Full" has a near-zero baseline even with remote storage (iSCSI/FC)
    # because it requires every runnable task to be simultaneously blocked
    # on I/O.  "Some" can have a non-trivial baseline (2–15%) on nodes
    # with active remote storage workloads due to inherent I/O latency
    # and page cache misses — even healthy iSCSI generates some stalls.
    #
    # We record both flavors at all scopes for dashboard visibility,
    # but alert only on "full" (stalled) at the node level to avoid
    # false positives from the "some" baseline.
    #
    # For VM guests, KubeVirt does not expose PSI from inside the VM.
    # Instead we use storage I/O latency (time per operation) as the
    # saturation proxy — rising latency indicates storage path
    # congestion regardless of where the bottleneck is (NIC, switch,
    # array, or local disk).
    #
    # Scopes:
    #   node       = root cgroup id="/"    (all processes on the node)
    #   pod        = pod cgroup (container="", pod!="")
    #   container  = container cgroup (container!="", container!="POD")
    #   vm (guest) = kubevirt_vmi_storage_* I/O latency and throughput
    #
    # Requires cgroupv2 and kernel >= 4.20 with psi=1 boot parameter.
    - name: capacity-management-io-pressure.rules
      rules:
        # ── Node scope ───────────────────────────────────────────

        # Node-wide I/O pressure — "some" (at least one task waiting).
        - record: cluster:node:io:pressure_waiting:ratio
          expr: |
            rate(
              container_pressure_io_waiting_seconds_total{id="/"}[5m]
            )

        # Node-wide I/O pressure — "full" (ALL tasks waiting).
        - record: cluster:node:io:pressure_stalled:ratio
          expr: |
            rate(
              container_pressure_io_stalled_seconds_total{id="/"}[5m]
            )

        # ── Pod scope ────────────────────────────────────────────

        # Per-pod I/O pressure — "some".
        - record: pod:io:pressure_waiting:ratio
          expr: |
            rate(
              container_pressure_io_waiting_seconds_total{container="", pod!=""}[5m]
            )

        # Per-pod I/O pressure — "full".
        - record: pod:io:pressure_stalled:ratio
          expr: |
            rate(
              container_pressure_io_stalled_seconds_total{container="", pod!=""}[5m]
            )

        # ── Container scope ──────────────────────────────────────

        # Per-container I/O pressure — "some".
        - record: container:io:pressure_waiting:ratio
          expr: |
            rate(
              container_pressure_io_waiting_seconds_total{container!="", container!="POD"}[5m]
            )

        # Per-container I/O pressure — "full".
        - record: container:io:pressure_stalled:ratio
          expr: |
            rate(
              container_pressure_io_stalled_seconds_total{container!="", container!="POD"}[5m]
            )

        # ── VM guest scope ───────────────────────────────────────
        #
        # Storage read latency (seconds per operation, per drive).
        # Computed as time spent in reads / number of read ops.
        # The > 0 guard on the denominator avoids division by zero
        # when a drive has no read activity.
        - record: vmi:storage:read_latency:seconds
          expr: |
            rate(kubevirt_vmi_storage_read_times_seconds_total[5m])
            /
            (rate(kubevirt_vmi_storage_iops_read_total[5m]) > 0)

        # Storage write latency (seconds per operation, per drive).
        - record: vmi:storage:write_latency:seconds
          expr: |
            rate(kubevirt_vmi_storage_write_times_seconds_total[5m])
            /
            (rate(kubevirt_vmi_storage_iops_write_total[5m]) > 0)

        # Total storage throughput per VM (bytes/s, read + write).
        # Summed across drives — useful for dashboarding aggregate
        # I/O load per VM.
        - record: vmi:storage:throughput:bytes_per_second
          expr: |
            sum by (namespace, name, node) (
              rate(kubevirt_vmi_storage_read_traffic_bytes_total[5m])
            + rate(kubevirt_vmi_storage_write_traffic_bytes_total[5m])
            )

    # ── Fibre Channel HBA monitoring ──────────────────────────────
    #
    # Fibre Channel HBA metrics come from node_exporter's fibrechannel
    # collector, which reads /sys/class/fc_host/hostN/statistics/.
    # These are the storage-fabric equivalent of network NIC metrics:
    # throughput, utilization vs link speed, and error counters.
    #
    # NOTE: As of OpenShift 4.x, the fibrechannel collector is not
    # enabled in the default node_exporter configuration.  These rules
    # are forward-looking for environments with FC-attached storage
    # where the collector is enabled (custom node_exporter config or
    # future OpenShift versions).  When no FC HBAs exist or the
    # collector is disabled, these rules produce no time series
    # (safe no-op).
    #
    # FC speed is reported as a string label in node_fibrechannel_info
    # ("16 Gbit", "32 Gbit", etc.) rather than a numeric gauge.  The
    # port_speed recording rule converts the label to bytes/sec using
    # the standard FC rate table (the "* 0 + N" PromQL pattern).
    #
    # FC throughput counters (tx_words, rx_words) are in FC words;
    # 1 FC word = 4 bytes.  Only ports with port_state="Online" are
    # monitored.
    #
    # FC uses credit-based flow control, so congestion manifests as
    # credit starvation (latency spikes, throughput drops) rather
    # than packet loss.  The same 70%/85% saturation thresholds used
    # for NICs apply — ISL congestion becomes a factor at 60–70%.
    - name: capacity-management-fc.rules
      rules:
        # ── FC port speed (label → numeric gauge) ────────────────
        #
        # Converts the string speed label to bytes/sec using the
        # standard FC rate table.  The "* 0 + N" trick creates a
        # numeric gauge that retains the original label set.
        # Covers all defined FC speeds from 1G to 128G FC.
        - record: cluster:node:fc:port_speed:bytes_per_second
          expr: |
            (node_fibrechannel_info{speed="128 Gbit",port_state="Online"} * 0 + 16000000000)
            or (node_fibrechannel_info{speed="64 Gbit",port_state="Online"} * 0 + 8000000000)
            or (node_fibrechannel_info{speed="32 Gbit",port_state="Online"} * 0 + 4000000000)
            or (node_fibrechannel_info{speed="16 Gbit",port_state="Online"} * 0 + 2000000000)
            or (node_fibrechannel_info{speed="8 Gbit",port_state="Online"} * 0 + 1000000000)
            or (node_fibrechannel_info{speed="4 Gbit",port_state="Online"} * 0 + 500000000)
            or (node_fibrechannel_info{speed="2 Gbit",port_state="Online"} * 0 + 250000000)
            or (node_fibrechannel_info{speed="1 Gbit",port_state="Online"} * 0 + 125000000)

        # ── FC utilization vs link speed ─────────────────────────

        # Transmit utilization: rate(tx_words * 4) / speed_bytes.
        - record: cluster:node:fc:transmit_utilization:ratio
          expr: |
            (rate(node_fibrechannel_tx_words_total[5m]) * 4)
            / on (instance, fc_host) group_left
            cluster:node:fc:port_speed:bytes_per_second

        # Receive utilization: rate(rx_words * 4) / speed_bytes.
        - record: cluster:node:fc:receive_utilization:ratio
          expr: |
            (rate(node_fibrechannel_rx_words_total[5m]) * 4)
            / on (instance, fc_host) group_left
            cluster:node:fc:port_speed:bytes_per_second

        # ── FC error counters ────────────────────────────────────
        #
        # Error frames + invalid CRC indicate fabric problems
        # (bad SFP, damaged cable, ISL congestion causing frame
        # corruption).  Normal value is 0 — any sustained rate
        # indicates a hardware or fabric issue.
        - record: cluster:node:fc:error_rate:frames_per_second
          expr: |
            rate(node_fibrechannel_error_frames_total[5m])
            + rate(node_fibrechannel_invalid_crc_total[5m])

        # Loss of signal + loss of sync indicate physical layer
        # problems (cable fault, failing SFP transceiver, loose
        # connector).  Normal value is 0.
        - record: cluster:node:fc:link_loss_rate:per_second
          expr: |
            rate(node_fibrechannel_loss_of_signal_total[5m])
            + rate(node_fibrechannel_loss_of_sync_total[5m])

    # ── Container / Pod OOM proximity ─────────────────────────────
    #
    # Two recording rules that power the OOM proximity alerts:
    #
    #   1. Per-container: working_set / container limit
    #      Only containers with an explicit memory limit produce a
    #      series.  Containers without limits are excluded — they
    #      cannot OOM at the container cgroup level (node-level
    #      alerts cover them instead).
    #
    #   2. Per-pod: pod cgroup working_set / pod cgroup memory.max
    #      The pod cgroup's memory.max is set by the kubelet from
    #      either the sum of container limits (traditional) or the
    #      pod-level spec.resources.limits.memory (PodLevelResources,
    #      beta since k8s 1.34).  Pods without any limit report 0
    #      and are excluded.
    #
    # Both use container_memory_working_set_bytes, which is what the
    # kubelet uses for eviction decisions and what correlates with
    # OOM kills (it excludes freely-reclaimable inactive file cache).

    - name: capacity-management-oom-proximity.rules
      rules:
        # Per-container: working_set / limit.
        # kube_pod_container_resource_limits only exists for containers
        # with an explicit limits.memory, so the join naturally excludes
        # containers without limits.
        - record: container:memory:working_set_utilization:ratio
          expr: |
            (
              container_memory_working_set_bytes{container!="", container!="POD"}
            / on (namespace, pod, container) group_left
              kube_pod_container_resource_limits{resource="memory"}
            )

        # Per-pod: pod cgroup working_set / pod cgroup memory.max.
        # container_spec_memory_limit_bytes with container="" reads
        # the pod cgroup's memory.max directly — this automatically
        # reflects either the sum of container limits or the pod-level
        # limit (PodLevelResources).  Value is 0 when unlimited.
        - record: pod:memory:working_set_utilization:ratio
          expr: |
            (
              container_memory_working_set_bytes{container="", pod!=""}
            /
              (container_spec_memory_limit_bytes{container="", pod!=""} > 0)
            )
