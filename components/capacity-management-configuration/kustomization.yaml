apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Source of truth: https://github.com/raffaelespazzoli/openshift-monitoring-addson
#
# Recording rules and alerts only — dashboards are deployed by the
# perses-ui component which references the upstream dashboards/ directory.
#
# Pin to a tag or commit SHA for production stability:
#   github.com/raffaelespazzoli/openshift-monitoring-addson//<area>?ref=v1.0.0
resources:
  - github.com/raffaelespazzoli/openshift-monitoring-addson//memory?ref=main
  - github.com/raffaelespazzoli/openshift-monitoring-addson//cpu?ref=main
  - github.com/raffaelespazzoli/openshift-monitoring-addson//networking?ref=main
  - github.com/raffaelespazzoli/openshift-monitoring-addson//storage?ref=main
  - github.com/raffaelespazzoli/openshift-monitoring-addson//capacity?ref=main
