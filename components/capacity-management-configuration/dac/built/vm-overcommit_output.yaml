kind: Dashboard
metadata:
  name: vm-overcommit
  createdAt: "0001-01-01T00:00:00Z"
  project: perses
  updatedAt: "0001-01-01T00:00:00Z"
  version: 0
spec:
  display:
    name: VM Overcommit
    description: |-
      Statistical overcommit analysis based on observed aggregate VM usage volatility.
      Normal = assumes bell-curve distribution for VM load.
      Chebyshev = no assumption on distribution, but more conservative.
      Both use the same mean (μ) and standard deviation (σ) computed over the observation period.
  variables:
    - kind: ListVariable
      spec:
        display:
          name: Observation period
          hidden: false
        defaultValue:
          singleValue: 30d
          sliceValues: []
        name: observation_period
        allowAllValue: false
        allowMultiple: false
        plugin:
          kind: StaticListVariable
          spec:
            values:
              - value: 7d
                label: 7 days
              - value: 30d
                label: 30 days
              - value: 180d
                label: 180 days
              - value: 360d
                label: 360 days
    - kind: ListVariable
      spec:
        display:
          name: Confidence level
          hidden: false
        defaultValue:
          singleValue: "0.999"
          sliceValues: []
        name: confidence
        allowAllValue: false
        allowMultiple: false
        plugin:
          kind: StaticListVariable
          spec:
            values:
              - value: "0.95"
                label: 95%
              - value: "0.99"
                label: 99%
              - value: "0.995"
                label: 99.5%
              - value: "0.999"
                label: 99.9%
              - value: "0.9995"
                label: 99.95%
              - value: "0.9999"
                label: 99.99%
  panels:
    "0_0":
      kind: Panel
      spec:
        display:
          name: Normal — assumes normal distribution for VM load
          description: Overcommit = Granted / (μ + z×σ). The z-score is looked up from the standard normal table for the selected confidence level.
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 2
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: |-
                    sum(kubevirt_vmi_memory_domain_bytes)
                    / (
                      sum(avg_over_time(cluster:vm_memory_actual_used:bytes[$observation_period]))
                      + ((vector($confidence) == bool 0.95) * 1.645 + (vector($confidence) == bool 0.99) * 2.326 + (vector($confidence) == bool 0.995) * 2.576 + (vector($confidence) == bool 0.999) * 3.090 + (vector($confidence) == bool 0.9995) * 3.291 + (vector($confidence) == bool 0.9999) * 3.719)
                        * sum(stddev_over_time(cluster:vm_memory_actual_used:bytes[$observation_period]))
                    )
                  seriesNameFormat: normal
                  minStep: 5m
    "0_1":
      kind: Panel
      spec:
        display:
          name: Chebyshev — no assumption on load distribution, more conservative
          description: Overcommit = Granted / (μ + k×σ) where k = √(q/(1−q)). The Cantelli inequality guarantees this bound for any distribution shape.
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 2
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: |-
                    sum(kubevirt_vmi_memory_domain_bytes)
                    / (
                      sum(avg_over_time(cluster:vm_memory_actual_used:bytes[$observation_period]))
                      + sqrt(vector($confidence / (1 - $confidence)))
                        * sum(stddev_over_time(cluster:vm_memory_actual_used:bytes[$observation_period]))
                    )
                  seriesNameFormat: chebyshev
                  minStep: 5m
    "1_0":
      kind: Panel
      spec:
        display:
          name: Normal — assumes normal distribution for VM load
          description: Overcommit = Granted / (μ + z×σ). The z-score is looked up from the standard normal table for the selected confidence level.
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 2
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: |-
                    sum(vmi:kubevirt_vmi_vcpu:count)
                    / (
                      sum(avg_over_time(cluster:vm_cpu_actual_used:cores[$observation_period]))
                      + ((vector($confidence) == bool 0.95) * 1.645 + (vector($confidence) == bool 0.99) * 2.326 + (vector($confidence) == bool 0.995) * 2.576 + (vector($confidence) == bool 0.999) * 3.090 + (vector($confidence) == bool 0.9995) * 3.291 + (vector($confidence) == bool 0.9999) * 3.719)
                        * sum(stddev_over_time(cluster:vm_cpu_actual_used:cores[$observation_period]))
                    )
                  seriesNameFormat: normal
                  minStep: 5m
    "1_1":
      kind: Panel
      spec:
        display:
          name: Chebyshev — no assumption on load distribution, more conservative
          description: Overcommit = Granted / (μ + k×σ) where k = √(q/(1−q)). The Cantelli inequality guarantees this bound for any distribution shape.
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 2
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: |-
                    sum(vmi:kubevirt_vmi_vcpu:count)
                    / (
                      sum(avg_over_time(cluster:vm_cpu_actual_used:cores[$observation_period]))
                      + sqrt(vector($confidence / (1 - $confidence)))
                        * sum(stddev_over_time(cluster:vm_cpu_actual_used:cores[$observation_period]))
                    )
                  seriesNameFormat: chebyshev
                  minStep: 5m
    "2_0":
      kind: Panel
      spec:
        display:
          name: VM count
          description: Number of running VMs contributing to the aggregate.
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 0
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: count(kubevirt_vmi_memory_domain_bytes)
                  seriesNameFormat: VMs
                  minStep: 5m
    "3_0":
      kind: Panel
      spec:
        display:
          name: Memory
          description: Both approaches over time. The gap shows how much the distributional assumption matters.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: list
            visual:
              display: line
              areaOpacity: 0
              lineWidth: 2
            yAxis:
              format:
                unit: decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: |-
                    sum(kubevirt_vmi_memory_domain_bytes)
                    / (
                      sum(avg_over_time(cluster:vm_memory_actual_used:bytes[$observation_period]))
                      + ((vector($confidence) == bool 0.95) * 1.645 + (vector($confidence) == bool 0.99) * 2.326 + (vector($confidence) == bool 0.995) * 2.576 + (vector($confidence) == bool 0.999) * 3.090 + (vector($confidence) == bool 0.9995) * 3.291 + (vector($confidence) == bool 0.9999) * 3.719)
                        * sum(stddev_over_time(cluster:vm_memory_actual_used:bytes[$observation_period]))
                    )
                  seriesNameFormat: Normal
                  minStep: 5m
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: |-
                    sum(kubevirt_vmi_memory_domain_bytes)
                    / (
                      sum(avg_over_time(cluster:vm_memory_actual_used:bytes[$observation_period]))
                      + sqrt(vector($confidence / (1 - $confidence)))
                        * sum(stddev_over_time(cluster:vm_memory_actual_used:bytes[$observation_period]))
                    )
                  seriesNameFormat: Chebyshev
                  minStep: 5m
    "4_0":
      kind: Panel
      spec:
        display:
          name: CPU
          description: Both approaches over time.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: list
            visual:
              display: line
              areaOpacity: 0
              lineWidth: 2
            yAxis:
              format:
                unit: decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: |-
                    sum(vmi:kubevirt_vmi_vcpu:count)
                    / (
                      sum(avg_over_time(cluster:vm_cpu_actual_used:cores[$observation_period]))
                      + ((vector($confidence) == bool 0.95) * 1.645 + (vector($confidence) == bool 0.99) * 2.326 + (vector($confidence) == bool 0.995) * 2.576 + (vector($confidence) == bool 0.999) * 3.090 + (vector($confidence) == bool 0.9995) * 3.291 + (vector($confidence) == bool 0.9999) * 3.719)
                        * sum(stddev_over_time(cluster:vm_cpu_actual_used:cores[$observation_period]))
                    )
                  seriesNameFormat: Normal
                  minStep: 5m
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: |-
                    sum(vmi:kubevirt_vmi_vcpu:count)
                    / (
                      sum(avg_over_time(cluster:vm_cpu_actual_used:cores[$observation_period]))
                      + sqrt(vector($confidence / (1 - $confidence)))
                        * sum(stddev_over_time(cluster:vm_cpu_actual_used:cores[$observation_period]))
                    )
                  seriesNameFormat: Chebyshev
                  minStep: 5m
  layouts:
    - kind: Grid
      spec:
        display:
          title: Memory Overcommit Ratio
        items:
          - x: 0
            "y": 0
            width: 12
            height: 8
            content:
              $ref: '#/spec/panels/0_0'
          - x: 12
            "y": 0
            width: 12
            height: 8
            content:
              $ref: '#/spec/panels/0_1'
    - kind: Grid
      spec:
        display:
