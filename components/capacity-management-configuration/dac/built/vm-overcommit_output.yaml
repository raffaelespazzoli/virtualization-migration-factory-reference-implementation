kind: Dashboard
metadata:
  name: vm-overcommit
  createdAt: "0001-01-01T00:00:00Z"
  project: perses
  updatedAt: "0001-01-01T00:00:00Z"
  version: 0
spec:
  display:
    name: VM Overcommit
    description: |-
      Statistical overcommit analysis based on observed aggregate VM usage volatility.
      Normal = assumes bell-curve distribution for VM load.
      Chebyshev = no assumption on distribution, but more conservative.
      Both use the same mean and standard deviation computed over the observation period.
  variables:
    - kind: ListVariable
      spec:
        display:
          name: Observation period
          hidden: false
        defaultValue:
          singleValue: 30d
          sliceValues: []
        name: observation_period
        allowAllValue: false
        allowMultiple: false
        plugin:
          kind: StaticListVariable
          spec:
            values:
              - value: 7d
                label: 7 days
              - value: 30d
                label: 30 days
              - value: 180d
                label: 180 days
              - value: 360d
                label: 360 days
    - kind: ListVariable
      spec:
        display:
          name: Confidence level
          hidden: false
        defaultValue:
          singleValue: "0.999"
          sliceValues: []
        name: risk_quantile
        allowAllValue: false
        allowMultiple: false
        plugin:
          kind: StaticListVariable
          spec:
            values:
              - value: "0.95"
                label: 95% (p=5%)
              - value: "0.99"
                label: 99% (p=1%)
              - value: "0.995"
                label: 99.5% (p=0.5%)
              - value: "0.999"
                label: 99.9% (p=0.1%)
    - kind: ListVariable
      spec:
        display:
          name: Normal z-score
          hidden: false
        defaultValue:
          singleValue: "3.090"
          sliceValues: []
        name: z_score
        allowAllValue: false
        allowMultiple: false
        plugin:
          kind: StaticListVariable
          spec:
            values:
              - value: "1.645"
                label: 95% (z=1.645)
              - value: "2.326"
                label: 99% (z=2.326)
              - value: "2.576"
                label: 99.5% (z=2.576)
              - value: "3.090"
                label: 99.9% (z=3.090)
  panels:
    "0_0":
      kind: Panel
      spec:
        display:
          name: Normal
          description: Assumed normal distribution for VM load. Overcommit = Granted / (μ + z×σ).
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 2
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: |-
                    sum(kubevirt_vmi_memory_domain_bytes)
                    / (
                      sum(avg_over_time(cluster:vm_memory_actual_used:bytes[$observation_period]))
                      + $z_score
                        * sum(stddev_over_time(cluster:vm_memory_actual_used:bytes[$observation_period]))
                    )
                  seriesNameFormat: normal
                  minStep: 5m
    "0_1":
      kind: Panel
      spec:
        display:
          name: Chebyshev
          description: No assumption on load distribution, but more conservative. Overcommit = Granted / (μ + k×σ) with Cantelli k = √(q/(1−q)).
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 2
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: |-
                    sum(kubevirt_vmi_memory_domain_bytes)
                    / (
                      sum(avg_over_time(cluster:vm_memory_actual_used:bytes[$observation_period]))
                      + sqrt(vector($risk_quantile / (1 - $risk_quantile)))
                        * sum(stddev_over_time(cluster:vm_memory_actual_used:bytes[$observation_period]))
                    )
                  seriesNameFormat: chebyshev
                  minStep: 5m
    "1_0":
      kind: Panel
      spec:
        display:
          name: Normal
          description: Assumed normal distribution for VM load. Overcommit = Granted / (μ + z×σ).
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 2
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: |-
                    sum(vmi:kubevirt_vmi_vcpu:count)
                    / (
                      sum(avg_over_time(cluster:vm_cpu_actual_used:cores[$observation_period]))
                      + $z_score
                        * sum(stddev_over_time(cluster:vm_cpu_actual_used:cores[$observation_period]))
                    )
                  seriesNameFormat: normal
                  minStep: 5m
    "1_1":
      kind: Panel
      spec:
        display:
          name: Chebyshev
          description: No assumption on load distribution, but more conservative. Overcommit = Granted / (μ + k×σ) with Cantelli k = √(q/(1−q)).
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 2
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: |-
                    sum(vmi:kubevirt_vmi_vcpu:count)
                    / (
                      sum(avg_over_time(cluster:vm_cpu_actual_used:cores[$observation_period]))
                      + sqrt(vector($risk_quantile / (1 - $risk_quantile)))
                        * sum(stddev_over_time(cluster:vm_cpu_actual_used:cores[$observation_period]))
                    )
                  seriesNameFormat: chebyshev
                  minStep: 5m
    "2_0":
      kind: Panel
      spec:
        display:
          name: VM count
          description: Number of running VMs contributing to the aggregate.
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 0
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: count(kubevirt_vmi_memory_domain_bytes)
                  seriesNameFormat: VMs
                  minStep: 5m
    "3_0":
      kind: Panel
      spec:
        display:
          name: Memory
          description: Both approaches over time. The gap shows how much the distributional assumption matters.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: list
            visual:
              display: line
              areaOpacity: 0
              lineWidth: 2
            yAxis:
              format:
                unit: decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: |-
                    sum(kubevirt_vmi_memory_domain_bytes)
                    / (
                      sum(avg_over_time(cluster:vm_memory_actual_used:bytes[$observation_period]))
                      + $z_score
                        * sum(stddev_over_time(cluster:vm_memory_actual_used:bytes[$observation_period]))
                    )
                  seriesNameFormat: Normal
                  minStep: 5m
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: |-
                    sum(kubevirt_vmi_memory_domain_bytes)
                    / (
                      sum(avg_over_time(cluster:vm_memory_actual_used:bytes[$observation_period]))
                      + sqrt(vector($risk_quantile / (1 - $risk_quantile)))
                        * sum(stddev_over_time(cluster:vm_memory_actual_used:bytes[$observation_period]))
                    )
                  seriesNameFormat: Chebyshev
                  minStep: 5m
    "4_0":
      kind: Panel
      spec:
        display:
          name: CPU
          description: Both approaches over time.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: list
            visual:
              display: line
              areaOpacity: 0
              lineWidth: 2
            yAxis:
              format:
                unit: decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: |-
                    sum(vmi:kubevirt_vmi_vcpu:count)
                    / (
                      sum(avg_over_time(cluster:vm_cpu_actual_used:cores[$observation_period]))
                      + $z_score
                        * sum(stddev_over_time(cluster:vm_cpu_actual_used:cores[$observation_period]))
                    )
                  seriesNameFormat: Normal
                  minStep: 5m
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: |-
                    sum(vmi:kubevirt_vmi_vcpu:count)
                    / (
                      sum(avg_over_time(cluster:vm_cpu_actual_used:cores[$observation_period]))
                      + sqrt(vector($risk_quantile / (1 - $risk_quantile)))
                        * sum(stddev_over_time(cluster:vm_cpu_actual_used:cores[$observation_period]))
                    )
                  seriesNameFormat: Chebyshev
                  minStep: 5m
  layouts:
    - kind: Grid
      spec:
        display:
          title: Memory Overcommit Ratio
        items:
          - x: 0
            "y": 0
            width: 12
            height: 8
            content:
              $ref: '#/spec/panels/0_0'
          - x: 12
            "y": 0
            width: 12
            height: 8
            content:
              $ref: '#/spec/panels/0_1'
    - kind: Grid
      spec:
        display:
          title: CPU Overcommit Ratio
        items:
          - x: 0
            "y": 0
            width: 12
            height: 8
            content:
              $ref: '#/spec/panels/1_0'
          - x: 12
            "y": 0
            width: 12
            height: 8
            content:
              $ref: '#/spec/panels/1_1'
    - kind: Grid
      spec:
        display:
          title: Diagnostics
        items:
          - x: 0
            "y": 0
            width: 24
            height: 8
            content:
              $ref: '#/spec/panels/2_0'
    - kind: Grid
      spec:
        display:
          title: Memory Overcommit Trend
        items:
          - x: 0
            "y": 0
            width: 24
            height: 12
            content:
              $ref: '#/spec/panels/3_0'
    - kind: Grid
      spec:
        display:
          title: CPU Overcommit Trend
        items:
          - x: 0
            "y": 0
            width: 24
            height: 12
            content:
              $ref: '#/spec/panels/4_0'
  duration: 5m
