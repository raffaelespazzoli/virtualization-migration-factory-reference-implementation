kind: Dashboard
metadata:
  name: capacity-exhaustion
  createdAt: "0001-01-01T00:00:00Z"
  project: openshift-operators
  updatedAt: "0001-01-01T00:00:00Z"
  version: 0
spec:
  display:
    name: Time to Capacity Exhaustion
    description: Days until the cluster runs out of schedulable capacity based on recent trends.
  variables:
    - kind: ListVariable
      spec:
        display:
          name: Observation period
          hidden: false
        defaultValue:
          singleValue: 30d
          sliceValues: []
        name: observation_period
        allowAllValue: false
        allowMultiple: false
        plugin:
          kind: StaticListVariable
          spec:
            values:
              - value: 7d
                label: 7 days
              - value: 30d
                label: 30 days
              - value: 180d
                label: 180 days
              - value: 360d
                label: 360 days
  panels:
    "0_0":
      kind: Panel
      spec:
        display:
          name: Days to Exhaustion
          description: Days until the cluster runs out of capacity (whichever resource exhausts first). Gauge capped at 365; values at max mean capacity is stable or growing.
        plugin:
          kind: GaugeChart
          spec:
            calculation: last-number
            format:
              unit: decimal
              decimalPlaces: 0
            max: 365
            thresholds:
              steps:
                - value: 0
                  color: '#f53636'
                - value: 30
                  color: '#ed8128'
                - value: 90
                  color: '#32ac2d'
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: clamp_max(cluster:days_to_exhaustion_$observation_period:days, 365)
                  seriesNameFormat: days to exhaustion
    "1_0":
      kind: Panel
      spec:
        display:
          name: Days to Exhaustion Trend
          description: How the estimated days until exhaustion has changed over time for memory and CPU. Lines disappear when capacity is stable or growing (+Inf).
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: list
            yAxis:
              format:
                unit: decimal
                decimalPlaces: 0
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: cluster:days_to_exhaustion_memory_$observation_period:days
                  seriesNameFormat: Memory
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: cluster:days_to_exhaustion_cpu_$observation_period:days
                  seriesNameFormat: CPU
  layouts:
    - kind: Grid
      spec:
        display:
          title: Current Estimate
        items:
          - x: 0
            "y": 0
            width: 24
            height: 8
            content:
              $ref: '#/spec/panels/0_0'
    - kind: Grid
      spec:
        display:
          title: Trend
        items:
          - x: 0
            "y": 0
            width: 24
            height: 12
            content:
              $ref: '#/spec/panels/1_0'
  duration: 6h
