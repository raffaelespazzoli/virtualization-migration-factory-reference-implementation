kind: Dashboard
metadata:
  name: node-memory
  createdAt: "0001-01-01T00:00:00Z"
  project: perses
  updatedAt: "0001-01-01T00:00:00Z"
  version: 0
spec:
  display:
    name: Node Memory
    description: 'Runtime memory decomposition per node: non-reclaimable, hot-reclaimable, cold-reclaimable, and free.'
  variables:
    - kind: ListVariable
      spec:
        display:
          name: Node
          hidden: false
        name: node
        allowAllValue: true
        allowMultiple: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
            labelName: node
            matchers:
              - kube_node_status_capacity{}
  panels:
    "0_0":
      kind: Panel
      spec:
        display:
          name: Capacity
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: bytes
              decimalPlaces: 1
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(kube_node_status_capacity{resource="memory", node=~"$node"})
    "0_1":
      kind: Panel
      spec:
        display:
          name: Allocatable
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: bytes
              decimalPlaces: 1
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(kube_node_status_allocatable{resource="memory", node=~"$node"})
    "0_2":
      kind: Panel
      spec:
        display:
          name: Reserved
          description: system-reserved + kube-reserved + eviction-threshold
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: bytes
              decimalPlaces: 1
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: |-
                    sum(kube_node_status_capacity{resource="memory", node=~"$node"})
                    - sum(kube_node_status_allocatable{resource="memory", node=~"$node"})
    "0_3":
      kind: Panel
      spec:
        display:
          name: Workload utilization
          description: kubepods.slice working_set / allocatable (kubelet eviction metric)
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: percent
              decimalPlaces: 1
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(cluster:node:memory:workloads_utilization:ratio{node=~"$node"})
    "0_4":
      kind: Panel
      spec:
        display:
          name: System used
          description: system.slice total usage (can exceed reserved via file cache)
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            format:
              unit: bytes
              decimalPlaces: 1
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(cluster:node:memory:system_used:bytes{node=~"$node"})
    "1_0":
      kind: Panel
      spec:
        display:
          name: Node Total
          description: 'Full node memory: system + workloads. Total height = node capacity.'
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: list
            visual:
              display: line
              areaOpacity: 0.7
              lineWidth: 2
              stack: all
            querySettings:
              - queryIndex: 5
                colorMode: fixed-single
                colorValue: '#FFFFFF'
                lineStyle: dotted
                stack: false
                areaOpacity: 0
            yAxis:
              format:
                unit: bytes
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(cluster:node:memory:workloads_non_reclaimable:bytes{node=~"$node"}) + sum(cluster:node:memory:system_non_reclaimable:bytes{node=~"$node"})
                  seriesNameFormat: Non-reclaimable (anon)
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(cluster:node:memory:workloads_overhead:bytes{node=~"$node"}) + sum(cluster:node:memory:system_overhead:bytes{node=~"$node"})
                  seriesNameFormat: Kernel overhead
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(cluster:node:memory:workloads_hot_reclaimable:bytes{node=~"$node"}) + sum(cluster:node:memory:system_hot_reclaimable:bytes{node=~"$node"})
                  seriesNameFormat: Reclaimable hot (active file)
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(cluster:node:memory:workloads_cold:bytes{node=~"$node"}) + sum(cluster:node:memory:system_cold:bytes{node=~"$node"})
                  seriesNameFormat: Reclaimable cold (inactive file)
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: |-
                    sum(kube_node_status_capacity{resource="memory", node=~"$node"})
                    - sum(cluster:node:memory:workloads_used:bytes{node=~"$node"})
                    - sum(cluster:node:memory:system_used:bytes{node=~"$node"})
                  seriesNameFormat: Free
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(kube_node_status_allocatable{resource="memory", node=~"$node"})
                  seriesNameFormat: ── Allocatable
    "1_1":
      kind: Panel
      spec:
        display:
          name: Workloads (kubepods.slice)
          description: Pod memory only. Total height = node allocatable.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: list
            visual:
              display: line
              areaOpacity: 0.7
              stack: all
            yAxis:
              format:
                unit: bytes
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(cluster:node:memory:workloads_non_reclaimable:bytes{node=~"$node"})
                  seriesNameFormat: Non-reclaimable (anon)
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(cluster:node:memory:workloads_overhead:bytes{node=~"$node"})
                  seriesNameFormat: Kernel overhead
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(cluster:node:memory:workloads_hot_reclaimable:bytes{node=~"$node"})
                  seriesNameFormat: Reclaimable hot (active file)
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(cluster:node:memory:workloads_cold:bytes{node=~"$node"})
                  seriesNameFormat: Reclaimable cold (inactive file)
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: |-
                    sum(kube_node_status_allocatable{resource="memory", node=~"$node"})
                    - sum(cluster:node:memory:workloads_used:bytes{node=~"$node"})
                  seriesNameFormat: Free
    "1_2":
      kind: Panel
      spec:
        display:
          name: System (system.slice)
          description: OS and Kubernetes system services. Compare with Reserved stat above — system usage commonly exceeds reservation due to file cache.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: list
            visual:
              display: line
              areaOpacity: 0.7
              lineWidth: 2
              stack: all
            querySettings:
              - queryIndex: 4
                colorMode: fixed-single
                colorValue: '#FF8C00'
                lineStyle: dotted
                stack: false
                areaOpacity: 0
            yAxis:
              format:
                unit: bytes
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(cluster:node:memory:system_non_reclaimable:bytes{node=~"$node"})
                  seriesNameFormat: Non-reclaimable (anon)
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(cluster:node:memory:system_overhead:bytes{node=~"$node"})
                  seriesNameFormat: Kernel overhead
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(cluster:node:memory:system_hot_reclaimable:bytes{node=~"$node"})
                  seriesNameFormat: Reclaimable hot (active file)
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(cluster:node:memory:system_cold:bytes{node=~"$node"})
                  seriesNameFormat: Reclaimable cold (inactive file)
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: |-
                    sum(kube_node_status_capacity{resource="memory", node=~"$node"})
                    - sum(kube_node_status_allocatable{resource="memory", node=~"$node"})
                  seriesNameFormat: ── Reserved
  layouts:
    - kind: Grid
      spec:
        display:
          title: Summary
        items:
          - x: 0
            "y": 0
            width: 4
            height: 8
            content:
              $ref: '#/spec/panels/0_0'
          - x: 4
            "y": 0
            width: 4
            height: 8
            content:
              $ref: '#/spec/panels/0_1'
          - x: 8
            "y": 0
            width: 4
            height: 8
            content:
              $ref: '#/spec/panels/0_2'
          - x: 12
            "y": 0
            width: 4
            height: 8
            content:
              $ref: '#/spec/panels/0_3'
          - x: 16
            "y": 0
            width: 4
            height: 8
            content:
              $ref: '#/spec/panels/0_4'
    - kind: Grid
      spec:
        display:
          title: Memory Decomposition
        items:
          - x: 0
            "y": 0
            width: 8
            height: 14
            content:
              $ref: '#/spec/panels/1_0'
          - x: 8
            "y": 0
            width: 8
            height: 14
            content:
              $ref: '#/spec/panels/1_1'
          - x: 16
            "y": 0
            width: 8
            height: 14
            content:
              $ref: '#/spec/panels/1_2'
  duration: 6h
