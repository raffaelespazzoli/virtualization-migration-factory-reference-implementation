apiVersion: v1
data:
  capacity-exhaustion.yaml: "kind: Dashboard\nmetadata:\n  name: capacity-exhaustion\n  createdAt: \"0001-01-01T00:00:00Z\"\n  project: perses\n  updatedAt: \"0001-01-01T00:00:00Z\"\n  version: 0\nspec:\n\
    \  display:\n    name: Time to Capacity Exhaustion\n    description: Days until the cluster runs out of schedulable capacity based on recent trends.\n  variables:\n    - kind: ListVariable\n      spec:\n\
    \        display:\n          name: Observation period\n          hidden: false\n        defaultValue: '30d'\n        name: observation_period\n        allowAllValue: false\n        allowMultiple: false\n\
    \        plugin:\n          kind: StaticListVariable\n          spec:\n            values:\n              - value: 7d\n                label: 7 days\n              - value: 30d\n                label:\
    \ 30 days\n              - value: 180d\n                label: 180 days\n              - value: 360d\n                label: 360 days\n  panels:\n    \"0_0\":\n      kind: Panel\n      spec:\n     \
    \   display:\n          name: Days to Exhaustion\n          description: Days until the cluster runs out of capacity (whichever resource exhausts first). Gauge capped at 365; values at max mean capacity\
    \ is stable or growing.\n        plugin:\n          kind: GaugeChart\n          spec:\n            calculation: last-number\n            format:\n              unit: decimal\n              decimalPlaces:\
    \ 0\n            max: 365\n            thresholds:\n              steps:\n                - value: 0\n                  color: '#f53636'\n                - value: 30\n                  color: '#ed8128'\n\
    \                - value: 90\n                  color: '#32ac2d'\n        queries:\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n\
    \                spec:\n                  query: clamp_max(cluster:days_to_exhaustion_$observation_period:days, 365)\n                  seriesNameFormat: days to exhaustion\n    \"1_0\":\n      kind:\
    \ Panel\n      spec:\n        display:\n          name: Days to Exhaustion Trend\n          description: How the estimated days until exhaustion has changed over time for memory and CPU. Lines disappear\
    \ when capacity is stable or growing (+Inf).\n        plugin:\n          kind: TimeSeriesChart\n          spec:\n            legend:\n              position: bottom\n              mode: list\n     \
    \       yAxis:\n              format:\n                unit: decimal\n                decimalPlaces: 0\n        queries:\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n\
    \                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: cluster:days_to_exhaustion_memory_$observation_period:days\n                  seriesNameFormat: Memory\n\
    \          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: cluster:days_to_exhaustion_cpu_$observation_period:days\n\
    \                  seriesNameFormat: CPU\n  layouts:\n    - kind: Grid\n      spec:\n        display:\n          title: Current Estimate\n        items:\n          - x: 0\n            \"y\": 0\n   \
    \         width: 24\n            height: 8\n            content:\n              $ref: '#/spec/panels/0_0'\n    - kind: Grid\n      spec:\n        display:\n          title: Trend\n        items:\n \
    \         - x: 0\n            \"y\": 0\n            width: 24\n            height: 12\n            content:\n              $ref: '#/spec/panels/1_0'\n  duration: 6h\n"
  node-memory.yaml: "kind: Dashboard\nmetadata:\n  name: node-memory\n  createdAt: \"0001-01-01T00:00:00Z\"\n  project: perses\n  updatedAt: \"0001-01-01T00:00:00Z\"\n  version: 0\nspec:\n  display:\n \
    \   name: Node Memory\n    description: 'Runtime memory decomposition per node: non-reclaimable, hot-reclaimable, cold-reclaimable, and free.'\n  variables:\n    - kind: ListVariable\n      spec:\n\
    \        display:\n          name: Node\n          hidden: false\n        name: node\n        allowAllValue: true\n        allowMultiple: false\n        plugin:\n          kind: PrometheusLabelValuesVariable\n\
    \          spec:\n            datasource:\n              kind: PrometheusDatasource\n            labelName: node\n            matchers:\n              - kube_node_status_capacity{}\n  panels:\n    \"\
    0_0\":\n      kind: Panel\n      spec:\n        display:\n          name: Capacity\n        plugin:\n          kind: StatChart\n          spec:\n            calculation: last-number\n            format:\n\
    \              unit: bytes\n              decimalPlaces: 1\n        queries:\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n\
    \                spec:\n                  query: sum(kube_node_status_capacity{resource=\"memory\", node=~\"$node\"})\n    \"0_1\":\n      kind: Panel\n      spec:\n        display:\n          name:\
    \ Allocatable\n        plugin:\n          kind: StatChart\n          spec:\n            calculation: last-number\n            format:\n              unit: bytes\n              decimalPlaces: 1\n   \
    \     queries:\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: sum(kube_node_status_allocatable{resource=\"\
    memory\", node=~\"$node\"})\n    \"0_2\":\n      kind: Panel\n      spec:\n        display:\n          name: Reserved\n          description: system-reserved + kube-reserved + eviction-threshold\n \
    \       plugin:\n          kind: StatChart\n          spec:\n            calculation: last-number\n            format:\n              unit: bytes\n              decimalPlaces: 1\n        queries:\n\
    \          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: |-\n                  \
    \  sum(kube_node_status_capacity{resource=\"memory\", node=~\"$node\"})\n                    - sum(kube_node_status_allocatable{resource=\"memory\", node=~\"$node\"})\n    \"0_3\":\n      kind: Panel\n\
    \      spec:\n        display:\n          name: Workload utilization\n          description: kubepods.slice working_set / allocatable (kubelet eviction metric)\n        plugin:\n          kind: StatChart\n\
    \          spec:\n            calculation: last-number\n            format:\n              unit: percent\n              decimalPlaces: 1\n        queries:\n          - kind: TimeSeriesQuery\n      \
    \      spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: sum(cluster:node:memory:workloads_utilization:ratio{node=~\"$node\"\
    })\n    \"0_4\":\n      kind: Panel\n      spec:\n        display:\n          name: System used\n          description: system.slice total usage (can exceed reserved via file cache)\n        plugin:\n\
    \          kind: StatChart\n          spec:\n            calculation: last-number\n            format:\n              unit: bytes\n              decimalPlaces: 1\n        queries:\n          - kind:\
    \ TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: sum(cluster:node:memory:system_used:bytes{node=~\"\
    $node\"})\n    \"1_0\":\n      kind: Panel\n      spec:\n        display:\n          name: Node Total\n          description: 'Full node memory: system + workloads. Total height = node capacity.'\n\
    \        plugin:\n          kind: TimeSeriesChart\n          spec:\n            legend:\n              position: bottom\n              mode: list\n            visual:\n              display: line\n\
    \              areaOpacity: 0.7\n              lineWidth: 2\n              stack: all\n            querySettings:\n              - queryIndex: 5\n                colorMode: fixed-single\n          \
    \      colorValue: '#FFFFFF'\n                lineStyle: dotted\n                stack: false\n                areaOpacity: 0\n            yAxis:\n              format:\n                unit: bytes\n\
    \        queries:\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: sum(cluster:node:memory:workloads_non_reclaimable:bytes{node=~\"\
    $node\"}) + sum(cluster:node:memory:system_non_reclaimable:bytes{node=~\"$node\"})\n                  seriesNameFormat: Non-reclaimable (anon)\n          - kind: TimeSeriesQuery\n            spec:\n\
    \              plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: sum(cluster:node:memory:workloads_overhead:bytes{node=~\"$node\"}) + sum(cluster:node:memory:system_overhead:bytes{node=~\"\
    $node\"})\n                  seriesNameFormat: Kernel overhead\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n       \
    \         spec:\n                  query: sum(cluster:node:memory:workloads_hot_reclaimable:bytes{node=~\"$node\"}) + sum(cluster:node:memory:system_hot_reclaimable:bytes{node=~\"$node\"})\n       \
    \           seriesNameFormat: Reclaimable hot (active file)\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n          \
    \      spec:\n                  query: sum(cluster:node:memory:workloads_cold:bytes{node=~\"$node\"}) + sum(cluster:node:memory:system_cold:bytes{node=~\"$node\"})\n                  seriesNameFormat:\
    \ Reclaimable cold (inactive file)\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n            \
    \      query: |-\n                    sum(kube_node_status_capacity{resource=\"memory\", node=~\"$node\"})\n                    - sum(cluster:node:memory:workloads_used:bytes{node=~\"$node\"})\n   \
    \                 - sum(cluster:node:memory:system_used:bytes{node=~\"$node\"})\n                  seriesNameFormat: Free\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n\
    \                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: sum(kube_node_status_allocatable{resource=\"memory\", node=~\"$node\"})\n                  seriesNameFormat:\
    \ ── Allocatable\n    \"1_1\":\n      kind: Panel\n      spec:\n        display:\n          name: Workloads (kubepods.slice)\n          description: Pod memory only. Total height = node allocatable.\n\
    \        plugin:\n          kind: TimeSeriesChart\n          spec:\n            legend:\n              position: bottom\n              mode: list\n            visual:\n              display: line\n\
    \              areaOpacity: 0.7\n              stack: all\n            yAxis:\n              format:\n                unit: bytes\n        queries:\n          - kind: TimeSeriesQuery\n            spec:\n\
    \              plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: sum(cluster:node:memory:workloads_non_reclaimable:bytes{node=~\"$node\"})\n \
    \                 seriesNameFormat: Non-reclaimable (anon)\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n           \
    \     spec:\n                  query: sum(cluster:node:memory:workloads_overhead:bytes{node=~\"$node\"})\n                  seriesNameFormat: Kernel overhead\n          - kind: TimeSeriesQuery\n   \
    \         spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: sum(cluster:node:memory:workloads_hot_reclaimable:bytes{node=~\"\
    $node\"})\n                  seriesNameFormat: Reclaimable hot (active file)\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n\
    \                spec:\n                  query: sum(cluster:node:memory:workloads_cold:bytes{node=~\"$node\"})\n                  seriesNameFormat: Reclaimable cold (inactive file)\n          - kind:\
    \ TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: |-\n                    sum(kube_node_status_allocatable{resource=\"\
    memory\", node=~\"$node\"})\n                    - sum(cluster:node:memory:workloads_used:bytes{node=~\"$node\"})\n                  seriesNameFormat: Free\n    \"1_2\":\n      kind: Panel\n      spec:\n\
    \        display:\n          name: System (system.slice)\n          description: OS and Kubernetes system services. Compare with Reserved stat above — system usage commonly exceeds reservation due to\
    \ file cache.\n        plugin:\n          kind: TimeSeriesChart\n          spec:\n            legend:\n              position: bottom\n              mode: list\n            visual:\n              display:\
    \ line\n              areaOpacity: 0.7\n              lineWidth: 2\n              stack: all\n            querySettings:\n              - queryIndex: 4\n                colorMode: fixed-single\n   \
    \             colorValue: '#FF8C00'\n                lineStyle: dotted\n                stack: false\n                areaOpacity: 0\n            yAxis:\n              format:\n                unit:\
    \ bytes\n        queries:\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query:\
    \ sum(cluster:node:memory:system_non_reclaimable:bytes{node=~\"$node\"})\n                  seriesNameFormat: Non-reclaimable (anon)\n          - kind: TimeSeriesQuery\n            spec:\n         \
    \     plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: sum(cluster:node:memory:system_overhead:bytes{node=~\"$node\"})\n                  seriesNameFormat:\
    \ Kernel overhead\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: sum(cluster:node:memory:system_hot_reclaimable:bytes{node=~\"\
    $node\"})\n                  seriesNameFormat: Reclaimable hot (active file)\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n\
    \                spec:\n                  query: sum(cluster:node:memory:system_cold:bytes{node=~\"$node\"})\n                  seriesNameFormat: Reclaimable cold (inactive file)\n          - kind:\
    \ TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: |-\n                    sum(kube_node_status_capacity{resource=\"\
    memory\", node=~\"$node\"})\n                    - sum(kube_node_status_allocatable{resource=\"memory\", node=~\"$node\"})\n                  seriesNameFormat: ── Reserved\n  layouts:\n    - kind: Grid\n\
    \      spec:\n        display:\n          title: Summary\n        items:\n          - x: 0\n            \"y\": 0\n            width: 4\n            height: 8\n            content:\n              $ref:\
    \ '#/spec/panels/0_0'\n          - x: 4\n            \"y\": 0\n            width: 4\n            height: 8\n            content:\n              $ref: '#/spec/panels/0_1'\n          - x: 8\n        \
    \    \"y\": 0\n            width: 4\n            height: 8\n            content:\n              $ref: '#/spec/panels/0_2'\n          - x: 12\n            \"y\": 0\n            width: 4\n           \
    \ height: 8\n            content:\n              $ref: '#/spec/panels/0_3'\n          - x: 16\n            \"y\": 0\n            width: 4\n            height: 8\n            content:\n             \
    \ $ref: '#/spec/panels/0_4'\n    - kind: Grid\n      spec:\n        display:\n          title: Memory Decomposition\n        items:\n          - x: 0\n            \"y\": 0\n            width: 8\n  \
    \          height: 14\n            content:\n              $ref: '#/spec/panels/1_0'\n          - x: 8\n            \"y\": 0\n            width: 8\n            height: 14\n            content:\n   \
    \           $ref: '#/spec/panels/1_1'\n          - x: 16\n            \"y\": 0\n            width: 8\n            height: 14\n            content:\n              $ref: '#/spec/panels/1_2'\n  duration:\
    \ 6h\n"
  pod-memory.yaml: "kind: Dashboard\nmetadata:\n  name: pod-memory\n  createdAt: \"0001-01-01T00:00:00Z\"\n  project: perses\n  updatedAt: \"0001-01-01T00:00:00Z\"\n  version: 0\nspec:\n  display:\n   \
    \ name: Pod Memory\n    description: 'Container memory decomposition: non-reclaimable, hot/cold reclaimable, kernel overhead, with limit threshold.'\n  variables:\n    - kind: ListVariable\n      spec:\n\
    \        display:\n          name: Namespace\n          hidden: false\n        name: namespace\n        allowAllValue: false\n        allowMultiple: false\n        plugin:\n          kind: PrometheusLabelValuesVariable\n\
    \          spec:\n            datasource:\n              kind: PrometheusDatasource\n            labelName: namespace\n            matchers:\n              - container_memory_working_set_bytes{}\n \
    \   - kind: ListVariable\n      spec:\n        display:\n          name: Pod\n          hidden: false\n        name: pod\n        allowAllValue: true\n        allowMultiple: false\n        plugin:\n\
    \          kind: PrometheusLabelValuesVariable\n          spec:\n            datasource:\n              kind: PrometheusDatasource\n            labelName: pod\n            matchers:\n              -\
    \ container_memory_working_set_bytes{namespace=~\"$namespace\",container!=\"\",container!=\"POD\"}\n    - kind: ListVariable\n      spec:\n        display:\n          name: Container\n          hidden:\
    \ false\n        name: container\n        allowAllValue: true\n        allowMultiple: false\n        plugin:\n          kind: PrometheusLabelValuesVariable\n          spec:\n            datasource:\n\
    \              kind: PrometheusDatasource\n            labelName: container\n            matchers:\n              - container_memory_working_set_bytes{namespace=~\"$namespace\",pod=~\"$pod\",container!=\"\
    \",container!=\"POD\"}\n  panels:\n    \"0_0\":\n      kind: Panel\n      spec:\n        display:\n          name: Working Set\n          description: Memory that cannot be freely reclaimed (usage minus\
    \ inactive file cache). This is what the kubelet uses for eviction and OOM decisions.\n        plugin:\n          kind: StatChart\n          spec:\n            calculation: last-number\n           \
    \ format:\n              unit: bytes\n              decimalPlaces: 1\n        queries:\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n\
    \                spec:\n                  query: sum(container_memory_working_set_bytes{namespace=~\"$namespace\", pod=~\"$pod\", container=~\"$container\", container!=\"POD\", container!=\"\"})\n \
    \   \"0_1\":\n      kind: Panel\n      spec:\n        display:\n          name: Memory Limit\n        plugin:\n          kind: StatChart\n          spec:\n            calculation: last-number\n    \
    \        format:\n              unit: bytes\n              decimalPlaces: 1\n        queries:\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n\
    \                spec:\n                  query: sum(kube_pod_container_resource_limits{resource=\"memory\", namespace=~\"$namespace\", pod=~\"$pod\", container=~\"$container\"})\n    \"0_2\":\n   \
    \   kind: Panel\n      spec:\n        display:\n          name: Utilization\n          description: working_set / limit — how close to OOM\n        plugin:\n          kind: StatChart\n          spec:\n\
    \            calculation: last-number\n            format:\n              unit: percent\n              decimalPlaces: 1\n            thresholds:\n              steps:\n                - value: 0\n \
    \                 color: '#32ac2d'\n                - value: 0.80\n                  color: '#ed8128'\n                - value: 0.95\n                  color: '#f53636'\n        queries:\n         \
    \ - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: |-\n                    sum(container_memory_working_set_bytes{namespace=~\"\
    $namespace\", pod=~\"$pod\", container=~\"$container\", container!=\"POD\", container!=\"\"})\n                    /\n                    sum(kube_pod_container_resource_limits{resource=\"memory\",\
    \ namespace=~\"$namespace\", pod=~\"$pod\", container=~\"$container\"})\n    \"0_3\":\n      kind: Panel\n      spec:\n        display:\n          name: RSS\n          description: Anonymous memory\
    \ (heap, stack). Cannot be reclaimed without swap — primary driver of OOM kills.\n        plugin:\n          kind: StatChart\n          spec:\n            calculation: last-number\n            format:\n\
    \              unit: bytes\n              decimalPlaces: 1\n        queries:\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n\
    \                spec:\n                  query: sum(container_memory_rss{namespace=~\"$namespace\", pod=~\"$pod\", container=~\"$container\", container!=\"POD\", container!=\"\"})\n    \"1_0\":\n \
    \     kind: Panel\n      spec:\n        display:\n          name: Memory Breakdown\n          description: Stacked memory usage with limit threshold. Total height = container_memory_usage_bytes.\n \
    \       plugin:\n          kind: TimeSeriesChart\n          spec:\n            legend:\n              position: bottom\n              mode: list\n            visual:\n              display: line\n \
    \             areaOpacity: 0.7\n              lineWidth: 2\n              stack: all\n            querySettings:\n              - queryIndex: 4\n                colorMode: fixed-single\n           \
    \     colorValue: '#FFFFFF'\n                lineStyle: dotted\n                stack: false\n                areaOpacity: 0\n            yAxis:\n              format:\n                unit: bytes\n\
    \        queries:\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: sum(container_memory_rss{namespace=~\"\
    $namespace\", pod=~\"$pod\", container=~\"$container\", container!=\"POD\", container!=\"\"})\n                  seriesNameFormat: Non-reclaimable (anon/RSS)\n          - kind: TimeSeriesQuery\n   \
    \         spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: |-\n                    sum(container_memory_usage_bytes{namespace=~\"\
    $namespace\", pod=~\"$pod\", container=~\"$container\", container!=\"POD\", container!=\"\"})\n                    - sum(container_memory_rss{namespace=~\"$namespace\", pod=~\"$pod\", container=~\"\
    $container\", container!=\"POD\", container!=\"\"})\n                    - sum(container_memory_cache{namespace=~\"$namespace\", pod=~\"$pod\", container=~\"$container\", container!=\"POD\", container!=\"\
    \"})\n                  seriesNameFormat: Kernel overhead\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n            \
    \    spec:\n                  query: |-\n                    sum(container_memory_cache{namespace=~\"$namespace\", pod=~\"$pod\", container=~\"$container\", container!=\"POD\", container!=\"\"})\n \
    \                   - (\n                      sum(container_memory_usage_bytes{namespace=~\"$namespace\", pod=~\"$pod\", container=~\"$container\", container!=\"POD\", container!=\"\"})\n         \
    \             - sum(container_memory_working_set_bytes{namespace=~\"$namespace\", pod=~\"$pod\", container=~\"$container\", container!=\"POD\", container!=\"\"})\n                    )\n           \
    \       seriesNameFormat: Reclaimable hot (active file)\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n              \
    \  spec:\n                  query: |-\n                    sum(container_memory_usage_bytes{namespace=~\"$namespace\", pod=~\"$pod\", container=~\"$container\", container!=\"POD\", container!=\"\"})\n\
    \                    - sum(container_memory_working_set_bytes{namespace=~\"$namespace\", pod=~\"$pod\", container=~\"$container\", container!=\"POD\", container!=\"\"})\n                  seriesNameFormat:\
    \ Reclaimable cold (inactive file)\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n            \
    \      query: sum(kube_pod_container_resource_limits{resource=\"memory\", namespace=~\"$namespace\", pod=~\"$pod\", container=~\"$container\"})\n                  seriesNameFormat: ── Memory Limit\n\
    \  layouts:\n    - kind: Grid\n      spec:\n        display:\n          title: Summary\n        items:\n          - x: 0\n            \"y\": 0\n            width: 6\n            height: 8\n        \
    \    content:\n              $ref: '#/spec/panels/0_0'\n          - x: 6\n            \"y\": 0\n            width: 6\n            height: 8\n            content:\n              $ref: '#/spec/panels/0_1'\n\
    \          - x: 12\n            \"y\": 0\n            width: 6\n            height: 8\n            content:\n              $ref: '#/spec/panels/0_2'\n          - x: 18\n            \"y\": 0\n      \
    \      width: 6\n            height: 8\n            content:\n              $ref: '#/spec/panels/0_3'\n    - kind: Grid\n      spec:\n        display:\n          title: Memory Decomposition\n      \
    \  items:\n          - x: 0\n            \"y\": 0\n            width: 24\n            height: 16\n            content:\n              $ref: '#/spec/panels/1_0'\n  duration: 6h\n"
  vm-capacity.yaml: "kind: Dashboard\nmetadata:\n  name: vm-capacity\n  createdAt: \"0001-01-01T00:00:00Z\"\n  project: perses\n  updatedAt: \"0001-01-01T00:00:00Z\"\n  version: 0\nspec:\n  display:\n \
    \   name: How many VMs fit\n    description: How many more virtual machines of a chosen shape fit in the remaining schedulable capacity.\n  variables:\n    - kind: ListVariable\n      spec:\n      \
    \  display:\n          name: VM memory\n          hidden: false\n        defaultValue: '\"8589934592\"'\n        name: vm_memory\n        allowAllValue: false\n        allowMultiple: false\n       \
    \ plugin:\n          kind: StaticListVariable\n          spec:\n            values:\n              - value: \"4294967296\"\n                label: 4 GiB\n              - value: \"8589934592\"\n    \
    \            label: 8 GiB\n              - value: \"17179869184\"\n                label: 16 GiB\n              - value: \"34359738368\"\n                label: 32 GiB\n              - value: \"68719476736\"\
    \n                label: 64 GiB\n    - kind: ListVariable\n      spec:\n        display:\n          name: VM CPU\n          hidden: false\n        defaultValue: '\"4\"'\n        name: vm_cpu\n     \
    \   allowAllValue: false\n        allowMultiple: false\n        plugin:\n          kind: StaticListVariable\n          spec:\n            values:\n              - value: \"1\"\n                label:\
    \ 1 vCPU\n              - value: \"2\"\n                label: 2 vCPU\n              - value: \"4\"\n                label: 4 vCPU\n              - value: \"8\"\n                label: 8 vCPU\n    \
    \          - value: \"16\"\n                label: 16 vCPU\n    - kind: ListVariable\n      spec:\n        display:\n          name: Memory overcommit\n          hidden: false\n        defaultValue:\
    \ '\"1\"'\n        name: memory_overcommit\n        allowAllValue: false\n        allowMultiple: false\n        plugin:\n          kind: StaticListVariable\n          spec:\n            values:\n  \
    \            - \"1\"\n              - \"1.5\"\n              - \"2\"\n              - \"2.5\"\n              - \"3\"\n              - \"4\"\n    - kind: ListVariable\n      spec:\n        display:\n\
    \          name: CPU overcommit\n          hidden: false\n        defaultValue: '\"1\"'\n        name: cpu_overcommit\n        allowAllValue: false\n        allowMultiple: false\n        plugin:\n \
    \         kind: StaticListVariable\n          spec:\n            values:\n              - \"1\"\n              - \"2\"\n              - \"4\"\n              - \"6\"\n              - \"8\"\n        \
    \      - \"10\"\n              - \"12\"\n  panels:\n    \"0_0\":\n      kind: Panel\n      spec:\n        display:\n          name: VMs that fit\n        plugin:\n          kind: StatChart\n       \
    \   spec:\n            calculation: last-number\n            format:\n              unit: decimal\n              decimalPlaces: 0\n        queries:\n          - kind: TimeSeriesQuery\n            spec:\n\
    \              plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: |-\n                    floor(clamp_max(\n                      cluster:available_capacity_memory:bytes\
    \ / $vm_memory * $memory_overcommit,\n                      scalar(cluster:available_capacity_cpu:cores / $vm_cpu * $cpu_overcommit)\n                    ))\n    \"0_1\":\n      kind: Panel\n      spec:\n\
    \        display:\n          name: Limited by\n          description: Whether remaining capacity runs out of memory or CPU first for the selected VM shape.\n        plugin:\n          kind: StatChart\n\
    \          spec:\n            calculation: last-number\n            format:\n              unit: decimal\n              decimalPlaces: 0\n            mappings:\n              - kind: Range\n       \
    \         spec:\n                  from: 0\n                  to: 0.5\n                  result:\n                    value: Memory bound\n              - kind: Range\n                spec:\n      \
    \            from: 0.5\n                  to: 1.5\n                  result:\n                    value: CPU bound\n        queries:\n          - kind: TimeSeriesQuery\n            spec:\n         \
    \     plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: |-\n                    (\n                      cluster:available_capacity_memory:bytes\
    \ / $vm_memory * $memory_overcommit\n                      > bool\n                      scalar(cluster:available_capacity_cpu:cores / $vm_cpu * $cpu_overcommit)\n                    )\n    \"0_2\"\
    :\n      kind: Panel\n      spec:\n        display:\n          name: Memory / CPU\n          description: GiB of memory request per CPU request. The node shape that matches the current workload.\n \
    \       plugin:\n          kind: StatChart\n          spec:\n            calculation: last-number\n            format:\n              unit: decimal\n              decimalPlaces: 2\n        queries:\n\
    \          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: cluster:memory_cpu_ratio:gib_per_core\n\
    \                  seriesNameFormat: GiB per core\n    \"1_0\":\n      kind: Panel\n      spec:\n        display:\n          name: Memory\n        plugin:\n          kind: TimeSeriesChart\n        \
    \  spec:\n            legend:\n              position: bottom\n              mode: list\n            visual:\n              display: bar\n              stack: all\n            yAxis:\n             \
    \ format:\n                unit: bytes\n        queries:\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n             \
    \   spec:\n                  query: cluster:non_vm_used_capacity_memory:bytes\n                  seriesNameFormat: Non-VM used\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n\
    \                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: cluster:vm_used_capacity_memory:bytes\n                  seriesNameFormat: VM used\n          - kind:\
    \ TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: cluster:available_capacity_memory:bytes\n\
    \                  seriesNameFormat: Available\n    \"1_1\":\n      kind: Panel\n      spec:\n        display:\n          name: CPU\n        plugin:\n          kind: TimeSeriesChart\n          spec:\n\
    \            legend:\n              position: bottom\n              mode: list\n            visual:\n              display: bar\n              stack: all\n            yAxis:\n              format:\n\
    \                unit: decimal\n        queries:\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n\
    \                  query: cluster:non_vm_used_capacity_cpu:cores\n                  seriesNameFormat: Non-VM used\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n     \
    \           kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: cluster:vm_used_capacity_cpu:cores\n                  seriesNameFormat: VM used\n          - kind: TimeSeriesQuery\n\
    \            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: cluster:available_capacity_cpu:cores\n                  seriesNameFormat:\
    \ Available\n  layouts:\n    - kind: Grid\n      spec:\n        display:\n          title: How many more VMs fit\n        items:\n          - x: 0\n            \"y\": 0\n            width: 8\n     \
    \       height: 8\n            content:\n              $ref: '#/spec/panels/0_0'\n          - x: 8\n            \"y\": 0\n            width: 8\n            height: 8\n            content:\n        \
    \      $ref: '#/spec/panels/0_1'\n          - x: 16\n            \"y\": 0\n            width: 8\n            height: 8\n            content:\n              $ref: '#/spec/panels/0_2'\n    - kind: Grid\n\
    \      spec:\n        display:\n          title: Capacity\n        items:\n          - x: 0\n            \"y\": 0\n            width: 12\n            height: 12\n            content:\n             \
    \ $ref: '#/spec/panels/1_0'\n          - x: 12\n            \"y\": 0\n            width: 12\n            height: 12\n            content:\n              $ref: '#/spec/panels/1_1'\n  duration: 1h\n"
  vm-memory.yaml: "kind: Dashboard\nmetadata:\n  name: vm-memory\n  createdAt: \"0001-01-01T00:00:00Z\"\n  project: perses\n  updatedAt: \"0001-01-01T00:00:00Z\"\n  version: 0\nspec:\n  display:\n    name:\
    \ VM Memory\n    description: 'Guest memory decomposition (kernel, non-reclaimable, reclaimable, free) and launcher overhead: estimated vs actual.'\n  variables:\n    - kind: ListVariable\n      spec:\n\
    \        display:\n          name: Namespace\n          hidden: false\n        name: namespace\n        allowAllValue: false\n        allowMultiple: false\n        plugin:\n          kind: PrometheusLabelValuesVariable\n\
    \          spec:\n            datasource:\n              kind: PrometheusDatasource\n            labelName: namespace\n            matchers:\n              - kubevirt_vmi_memory_available_bytes{}\n\
    \    - kind: ListVariable\n      spec:\n        display:\n          name: VM\n          hidden: false\n        name: vm\n        allowAllValue: false\n        allowMultiple: false\n        plugin:\n\
    \          kind: PrometheusLabelValuesVariable\n          spec:\n            datasource:\n              kind: PrometheusDatasource\n            labelName: name\n            matchers:\n             \
    \ - kubevirt_vmi_memory_available_bytes{namespace=~\"$namespace\"}\n  panels:\n    \"0_0\":\n      kind: Panel\n      spec:\n        display:\n          name: Domain\n          description: Total memory\
    \ allocated to the QEMU domain — the VM's configured size.\n        plugin:\n          kind: StatChart\n          spec:\n            calculation: last-number\n            format:\n              unit:\
    \ bytes\n              decimalPlaces: 1\n        queries:\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n            \
    \    spec:\n                  query: kubevirt_vmi_memory_domain_bytes{name=~\"$vm\", namespace=~\"$namespace\"}\n    \"0_1\":\n      kind: Panel\n      spec:\n        display:\n          name: Available\
    \ (MemTotal)\n          description: Usable memory inside the guest — domain minus kernel reserved.\n        plugin:\n          kind: StatChart\n          spec:\n            calculation: last-number\n\
    \            format:\n              unit: bytes\n              decimalPlaces: 1\n        queries:\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind:\
    \ PrometheusTimeSeriesQuery\n                spec:\n                  query: kubevirt_vmi_memory_available_bytes{name=~\"$vm\", namespace=~\"$namespace\"}\n    \"0_2\":\n      kind: Panel\n      spec:\n\
    \        display:\n          name: Used (non-reclaimable)\n          description: Memory actively in use — cannot be freed without swap or OOM.\n        plugin:\n          kind: StatChart\n        \
    \  spec:\n            calculation: last-number\n            format:\n              unit: bytes\n              decimalPlaces: 1\n        queries:\n          - kind: TimeSeriesQuery\n            spec:\n\
    \              plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: kubevirt_vmi_memory_used_bytes{name=~\"$vm\", namespace=~\"$namespace\"}\n  \
    \  \"0_3\":\n      kind: Panel\n      spec:\n        display:\n          name: Utilization\n          description: used / available — how close to guest OOM.\n        plugin:\n          kind: StatChart\n\
    \          spec:\n            calculation: last-number\n            format:\n              unit: percent-decimal\n              decimalPlaces: 1\n            thresholds:\n              steps:\n    \
    \            - value: 0\n                  color: '#32ac2d'\n                - value: 80\n                  color: '#ed8128'\n                - value: 95\n                  color: '#f53636'\n      \
    \  queries:\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: |-\n      \
    \              kubevirt_vmi_memory_used_bytes{name=~\"$vm\", namespace=~\"$namespace\"}\n                    / kubevirt_vmi_memory_available_bytes{name=~\"$vm\", namespace=~\"$namespace\"} * 100\n \
    \   \"0_4\":\n      kind: Panel\n      spec:\n        display:\n          name: Overhead Δ\n          description: Estimated overhead minus actual overhead. Positive = headroom. Negative = virt-controller\
    \ under-estimated.\n        plugin:\n          kind: StatChart\n          spec:\n            calculation: last-number\n            format:\n              unit: bytes\n              decimalPlaces: 1\n\
    \            thresholds:\n              steps:\n                - value: -536870912\n                  color: '#f53636'\n                - value: 0\n                  color: '#ed8128'\n            \
    \    - value: 104857600\n                  color: '#32ac2d'\n        queries:\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n\
    \                spec:\n                  query: |-\n                    scalar(kubevirt_vmi_launcher_memory_overhead_bytes{name=~\"$vm\", namespace=~\"$namespace\"})\n                    - scalar(vmi:virt_launcher_overhead_memory:bytes{name=~\"\
    $vm\", namespace=~\"$namespace\"})\n    \"1_0\":\n      kind: Panel\n      spec:\n        display:\n          name: Guest Memory Decomposition\n          description: 'Four layers summing to domain:\
    \ kernel reserved + non-reclaimable + reclaimable + free.'\n        plugin:\n          kind: TimeSeriesChart\n          spec:\n            legend:\n              position: bottom\n              mode:\
    \ list\n            visual:\n              display: line\n              areaOpacity: 0.7\n              lineWidth: 2\n              stack: all\n            querySettings:\n              - queryIndex:\
    \ 4\n                colorMode: fixed-single\n                colorValue: '#FFFFFF'\n                lineStyle: dotted\n                stack: false\n                areaOpacity: 0\n            yAxis:\n\
    \              format:\n                unit: bytes\n        queries:\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n\
    \                spec:\n                  query: |-\n                    kubevirt_vmi_memory_domain_bytes{name=~\"$vm\", namespace=~\"$namespace\"}\n                    - kubevirt_vmi_memory_available_bytes{name=~\"\
    $vm\", namespace=~\"$namespace\"}\n                  seriesNameFormat: Kernel reserved\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n\
    \                spec:\n                  query: kubevirt_vmi_memory_used_bytes{name=~\"$vm\", namespace=~\"$namespace\"}\n                  seriesNameFormat: Non-reclaimable (used)\n          - kind:\
    \ TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: kubevirt_vmi_memory_usable_bytes{name=~\"\
    $vm\", namespace=~\"$namespace\"} - kubevirt_vmi_memory_unused_bytes{name=~\"$vm\", namespace=~\"$namespace\"}\n                  seriesNameFormat: Reclaimable\n          - kind: TimeSeriesQuery\n \
    \           spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: kubevirt_vmi_memory_unused_bytes{name=~\"$vm\", namespace=~\"\
    $namespace\"}\n                  seriesNameFormat: Free\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n              \
    \  spec:\n                  query: kubevirt_vmi_memory_domain_bytes{name=~\"$vm\", namespace=~\"$namespace\"}\n                  seriesNameFormat: ── Domain (configured)\n    \"1_1\":\n      kind: Panel\n\
    \      spec:\n        display:\n          name: 'Launcher Overhead: Estimated vs Actual'\n          description: Estimated = virt-controller prediction. Actual = pod working_set minus guest RSS (recording\
    \ rule). When actual exceeds estimated, the overhead budget is too tight.\n        plugin:\n          kind: TimeSeriesChart\n          spec:\n            legend:\n              position: bottom\n  \
    \            mode: list\n            querySettings:\n              - queryIndex: 0\n                colorMode: fixed-single\n                colorValue: '#32ac2d'\n                lineStyle: dotted\n\
    \              - queryIndex: 1\n                colorMode: fixed-single\n                colorValue: '#2E79B5'\n            visual:\n              display: line\n              areaOpacity: 0\n     \
    \         lineWidth: 2\n            yAxis:\n              format:\n                unit: bytes\n        queries:\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n      \
    \          kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: kubevirt_vmi_launcher_memory_overhead_bytes{name=~\"$vm\", namespace=~\"$namespace\"}\n                  seriesNameFormat:\
    \ Estimated overhead\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: vmi:virt_launcher_overhead_memory:bytes{name=~\"\
    $vm\", namespace=~\"$namespace\"}\n                  seriesNameFormat: Actual overhead\n  layouts:\n    - kind: Grid\n      spec:\n        display:\n          title: Summary\n        items:\n      \
    \    - x: 0\n            \"y\": 0\n            width: 4\n            height: 8\n            content:\n              $ref: '#/spec/panels/0_0'\n          - x: 4\n            \"y\": 0\n            width:\
    \ 4\n            height: 8\n            content:\n              $ref: '#/spec/panels/0_1'\n          - x: 8\n            \"y\": 0\n            width: 4\n            height: 8\n            content:\n\
    \              $ref: '#/spec/panels/0_2'\n          - x: 12\n            \"y\": 0\n            width: 4\n            height: 8\n            content:\n              $ref: '#/spec/panels/0_3'\n      \
    \    - x: 16\n            \"y\": 0\n            width: 4\n            height: 8\n            content:\n              $ref: '#/spec/panels/0_4'\n    - kind: Grid\n      spec:\n        display:\n    \
    \      title: Memory Decomposition\n        items:\n          - x: 0\n            \"y\": 0\n            width: 12\n            height: 8\n            content:\n              $ref: '#/spec/panels/1_0'\n\
    \          - x: 12\n            \"y\": 0\n            width: 12\n            height: 8\n            content:\n              $ref: '#/spec/panels/1_1'\n  duration: 6h\n"
  vm-overcommit.yaml: "kind: Dashboard\nmetadata:\n  name: vm-overcommit\n  createdAt: \"0001-01-01T00:00:00Z\"\n  project: perses\n  updatedAt: \"0001-01-01T00:00:00Z\"\n  version: 0\nspec:\n  display:\n\
    \    name: VM Overcommit\n    description: |-\n      Statistical overcommit analysis based on observed aggregate VM usage volatility.\n      Normal = assumes bell-curve distribution for VM load.\n \
    \     Chebyshev = no assumption on distribution, but more conservative.\n      Both use the same mean and standard deviation computed over the observation period.\n  variables:\n    - kind: ListVariable\n\
    \      spec:\n        display:\n          name: Observation period\n          hidden: false\n        defaultValue: '30d'\n        name: observation_period\n        allowAllValue: false\n        allowMultiple:\
    \ false\n        plugin:\n          kind: StaticListVariable\n          spec:\n            values:\n              - value: 7d\n                label: 7 days\n              - value: 30d\n           \
    \     label: 30 days\n              - value: 180d\n                label: 180 days\n              - value: 360d\n                label: 360 days\n    - kind: ListVariable\n      spec:\n        display:\n\
    \          name: Confidence level\n          hidden: false\n        defaultValue: '\"0.999\"'\n        name: risk_quantile\n        allowAllValue: false\n        allowMultiple: false\n        plugin:\n\
    \          kind: StaticListVariable\n          spec:\n            values:\n              - value: \"0.95\"\n                label: 95% (p=5%)\n              - value: \"0.99\"\n                label:\
    \ 99% (p=1%)\n              - value: \"0.995\"\n                label: 99.5% (p=0.5%)\n              - value: \"0.999\"\n                label: 99.9% (p=0.1%)\n    - kind: ListVariable\n      spec:\n\
    \        display:\n          name: Normal z-score\n          hidden: false\n        defaultValue: '\"3.090\"'\n        name: z_score\n        allowAllValue: false\n        allowMultiple: false\n   \
    \     plugin:\n          kind: StaticListVariable\n          spec:\n            values:\n              - value: \"1.645\"\n                label: 95% (z=1.645)\n              - value: \"2.326\"\n  \
    \              label: 99% (z=2.326)\n              - value: \"2.576\"\n                label: 99.5% (z=2.576)\n              - value: \"3.090\"\n                label: 99.9% (z=3.090)\n  panels:\n \
    \   \"0_0\":\n      kind: Panel\n      spec:\n        display:\n          name: Normal\n          description: Assumed normal distribution for VM load. Overcommit = Granted / (μ + z×σ).\n        plugin:\n\
    \          kind: StatChart\n          spec:\n            calculation: last-number\n            format:\n              unit: decimal\n              decimalPlaces: 2\n        queries:\n          - kind:\
    \ TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: |-\n                    sum(kubevirt_vmi_memory_domain_bytes)\n\
    \                    / (\n                      sum(avg_over_time(cluster:vm_memory_actual_used:bytes[$observation_period]))\n                      + $z_score\n                        * sum(stddev_over_time(cluster:vm_memory_actual_used:bytes[$observation_period]))\n\
    \                    )\n                  seriesNameFormat: normal\n                  minStep: 5m\n    \"0_1\":\n      kind: Panel\n      spec:\n        display:\n          name: Chebyshev\n       \
    \   description: No assumption on load distribution, but more conservative. Overcommit = Granted / (μ + k×σ) with Cantelli k = √(q/(1−q)).\n        plugin:\n          kind: StatChart\n          spec:\n\
    \            calculation: last-number\n            format:\n              unit: decimal\n              decimalPlaces: 2\n        queries:\n          - kind: TimeSeriesQuery\n            spec:\n    \
    \          plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: |-\n                    sum(kubevirt_vmi_memory_domain_bytes)\n                 \
    \   / (\n                      sum(avg_over_time(cluster:vm_memory_actual_used:bytes[$observation_period]))\n                      + sqrt(vector($risk_quantile / (1 - $risk_quantile)))\n           \
    \             * sum(stddev_over_time(cluster:vm_memory_actual_used:bytes[$observation_period]))\n                    )\n                  seriesNameFormat: chebyshev\n                  minStep: 5m\n\
    \    \"1_0\":\n      kind: Panel\n      spec:\n        display:\n          name: Normal\n          description: Assumed normal distribution for VM load. Overcommit = Granted / (μ + z×σ).\n        plugin:\n\
    \          kind: StatChart\n          spec:\n            calculation: last-number\n            format:\n              unit: decimal\n              decimalPlaces: 2\n        queries:\n          - kind:\
    \ TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: |-\n                    sum(vmi:kubevirt_vmi_vcpu:count)\n\
    \                    / (\n                      sum(avg_over_time(cluster:vm_cpu_actual_used:cores[$observation_period]))\n                      + $z_score\n                        * sum(stddev_over_time(cluster:vm_cpu_actual_used:cores[$observation_period]))\n\
    \                    )\n                  seriesNameFormat: normal\n                  minStep: 5m\n    \"1_1\":\n      kind: Panel\n      spec:\n        display:\n          name: Chebyshev\n       \
    \   description: No assumption on load distribution, but more conservative. Overcommit = Granted / (μ + k×σ) with Cantelli k = √(q/(1−q)).\n        plugin:\n          kind: StatChart\n          spec:\n\
    \            calculation: last-number\n            format:\n              unit: decimal\n              decimalPlaces: 2\n        queries:\n          - kind: TimeSeriesQuery\n            spec:\n    \
    \          plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: |-\n                    sum(vmi:kubevirt_vmi_vcpu:count)\n                    / (\n\
    \                      sum(avg_over_time(cluster:vm_cpu_actual_used:cores[$observation_period]))\n                      + sqrt(vector($risk_quantile / (1 - $risk_quantile)))\n                      \
    \  * sum(stddev_over_time(cluster:vm_cpu_actual_used:cores[$observation_period]))\n                    )\n                  seriesNameFormat: chebyshev\n                  minStep: 5m\n    \"2_0\":\n\
    \      kind: Panel\n      spec:\n        display:\n          name: VM count\n          description: Number of running VMs contributing to the aggregate.\n        plugin:\n          kind: StatChart\n\
    \          spec:\n            calculation: last-number\n            format:\n              unit: decimal\n              decimalPlaces: 0\n        queries:\n          - kind: TimeSeriesQuery\n      \
    \      spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: count(kubevirt_vmi_memory_domain_bytes)\n                  seriesNameFormat:\
    \ VMs\n                  minStep: 5m\n    \"3_0\":\n      kind: Panel\n      spec:\n        display:\n          name: Memory\n          description: Both approaches over time. The gap shows how much\
    \ the distributional assumption matters.\n        plugin:\n          kind: TimeSeriesChart\n          spec:\n            legend:\n              position: bottom\n              mode: list\n         \
    \   visual:\n              display: line\n              areaOpacity: 0\n              lineWidth: 2\n            yAxis:\n              format:\n                unit: decimal\n        queries:\n     \
    \     - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: |-\n                    sum(kubevirt_vmi_memory_domain_bytes)\n\
    \                    / (\n                      sum(avg_over_time(cluster:vm_memory_actual_used:bytes[$observation_period]))\n                      + $z_score\n                        * sum(stddev_over_time(cluster:vm_memory_actual_used:bytes[$observation_period]))\n\
    \                    )\n                  seriesNameFormat: Normal\n                  minStep: 5m\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind:\
    \ PrometheusTimeSeriesQuery\n                spec:\n                  query: |-\n                    sum(kubevirt_vmi_memory_domain_bytes)\n                    / (\n                      sum(avg_over_time(cluster:vm_memory_actual_used:bytes[$observation_period]))\n\
    \                      + sqrt(vector($risk_quantile / (1 - $risk_quantile)))\n                        * sum(stddev_over_time(cluster:vm_memory_actual_used:bytes[$observation_period]))\n            \
    \        )\n                  seriesNameFormat: Chebyshev\n                  minStep: 5m\n    \"4_0\":\n      kind: Panel\n      spec:\n        display:\n          name: CPU\n          description:\
    \ Both approaches over time.\n        plugin:\n          kind: TimeSeriesChart\n          spec:\n            legend:\n              position: bottom\n              mode: list\n            visual:\n\
    \              display: line\n              areaOpacity: 0\n              lineWidth: 2\n            yAxis:\n              format:\n                unit: decimal\n        queries:\n          - kind:\
    \ TimeSeriesQuery\n            spec:\n              plugin:\n                kind: PrometheusTimeSeriesQuery\n                spec:\n                  query: |-\n                    sum(vmi:kubevirt_vmi_vcpu:count)\n\
    \                    / (\n                      sum(avg_over_time(cluster:vm_cpu_actual_used:cores[$observation_period]))\n                      + $z_score\n                        * sum(stddev_over_time(cluster:vm_cpu_actual_used:cores[$observation_period]))\n\
    \                    )\n                  seriesNameFormat: Normal\n                  minStep: 5m\n          - kind: TimeSeriesQuery\n            spec:\n              plugin:\n                kind:\
    \ PrometheusTimeSeriesQuery\n                spec:\n                  query: |-\n                    sum(vmi:kubevirt_vmi_vcpu:count)\n                    / (\n                      sum(avg_over_time(cluster:vm_cpu_actual_used:cores[$observation_period]))\n\
    \                      + sqrt(vector($risk_quantile / (1 - $risk_quantile)))\n                        * sum(stddev_over_time(cluster:vm_cpu_actual_used:cores[$observation_period]))\n               \
    \     )\n                  seriesNameFormat: Chebyshev\n                  minStep: 5m\n  layouts:\n    - kind: Grid\n      spec:\n        display:\n          title: Memory Overcommit Ratio\n       \
    \ items:\n          - x: 0\n            \"y\": 0\n            width: 12\n            height: 8\n            content:\n              $ref: '#/spec/panels/0_0'\n          - x: 12\n            \"y\": 0\n\
    \            width: 12\n            height: 8\n            content:\n              $ref: '#/spec/panels/0_1'\n    - kind: Grid\n      spec:\n        display:\n          title: CPU Overcommit Ratio\n\
