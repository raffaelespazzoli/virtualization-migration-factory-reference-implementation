apiVersion: v1
data:
  capacity-exhaustion.yaml: |
    kind: Dashboard
    metadata:
      name: capacity-exhaustion
      createdAt: "0001-01-01T00:00:00Z"
      project: openshift-operators
      updatedAt: "0001-01-01T00:00:00Z"
      version: 0
    spec:
      display:
        name: Time to Capacity Exhaustion
        description: Days until the cluster runs out of schedulable capacity based on recent trends.
      variables:
        - kind: ListVariable
          spec:
            display:
              name: Observation period
              hidden: false
            defaultValue:
              singleValue: 30d
              sliceValues: []
            name: observation_period
            allowAllValue: false
            allowMultiple: false
            plugin:
              kind: StaticListVariable
              spec:
                values:
                  - value: 7d
                    label: 7 days
                  - value: 30d
                    label: 30 days
                  - value: 180d
                    label: 180 days
                  - value: 360d
                    label: 360 days
      panels:
        "0_0":
          kind: Panel
          spec:
            display:
              name: Days to Exhaustion
              description: Days until the cluster runs out of capacity (whichever resource exhausts first). Gauge capped at 365; values at max mean capacity is stable or growing.
            plugin:
              kind: GaugeChart
              spec:
                calculation: last-number
                format:
                  unit: decimal
                  decimalPlaces: 0
                max: 365
                thresholds:
                  steps:
                    - value: 0
                      color: '#f53636'
                    - value: 30
                      color: '#ed8128'
                    - value: 90
                      color: '#32ac2d'
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: clamp_max(cluster:days_to_exhaustion_$observation_period:days, 365)
                      seriesNameFormat: days to exhaustion
        "1_0":
          kind: Panel
          spec:
            display:
              name: Days to Exhaustion Trend
              description: How the estimated days until exhaustion has changed over time for memory and CPU. Lines disappear when capacity is stable or growing (+Inf).
            plugin:
              kind: TimeSeriesChart
              spec:
                legend:
                  position: bottom
                  mode: list
                yAxis:
                  format:
                    unit: decimal
                    decimalPlaces: 0
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: cluster:days_to_exhaustion_memory_$observation_period:days
                      seriesNameFormat: Memory
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: cluster:days_to_exhaustion_cpu_$observation_period:days
                      seriesNameFormat: CPU
      layouts:
        - kind: Grid
          spec:
            display:
              title: Current Estimate
            items:
              - x: 0
                "y": 0
                width: 24
                height: 8
                content:
                  $ref: '#/spec/panels/0_0'
        - kind: Grid
          spec:
            display:
              title: Trend
            items:
              - x: 0
                "y": 0
                width: 24
                height: 12
                content:
                  $ref: '#/spec/panels/1_0'
      duration: 6h
  example.yaml: |
    kind: Dashboard
    metadata:
      name: myDashboardAsCode
      createdAt: "0001-01-01T00:00:00Z"
      project: myProject
      updatedAt: "0001-01-01T00:00:00Z"
      version: 0
    spec:
      panels: {}
      layouts: []
      duration: 1h
  node-memory.yaml: |
    kind: Dashboard
    metadata:
      name: node-memory
      createdAt: "0001-01-01T00:00:00Z"
      project: openshift-operators
      updatedAt: "0001-01-01T00:00:00Z"
      version: 0
    spec:
      display:
        name: Node Memory
        description: 'Runtime memory decomposition per node: non-reclaimable, hot-reclaimable, cold-reclaimable, and free.'
      variables:
        - kind: ListVariable
          spec:
            display:
              name: Node
              hidden: false
            name: node
            allowAllValue: true
            allowMultiple: false
            plugin:
              kind: PrometheusLabelValuesVariable
              spec:
                datasource:
                  kind: PrometheusDatasource
                labelName: node
                matchers:
                  - kube_node_status_capacity{}
      panels:
        "0_0":
          kind: Panel
          spec:
            display:
              name: Capacity
            plugin:
              kind: StatChart
              spec:
                calculation: last-number
                format:
                  unit: bytes
                  decimalPlaces: 1
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: sum(kube_node_status_capacity{resource="memory", node=~"$node"})
        "0_1":
          kind: Panel
          spec:
            display:
              name: Allocatable
            plugin:
              kind: StatChart
              spec:
                calculation: last-number
                format:
                  unit: bytes
                  decimalPlaces: 1
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: sum(kube_node_status_allocatable{resource="memory", node=~"$node"})
        "0_2":
          kind: Panel
          spec:
            display:
              name: Reserved
              description: system-reserved + kube-reserved + eviction-threshold
            plugin:
              kind: StatChart
              spec:
                calculation: last-number
                format:
                  unit: bytes
                  decimalPlaces: 1
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: |-
                        sum(kube_node_status_capacity{resource="memory", node=~"$node"})
                        - sum(kube_node_status_allocatable{resource="memory", node=~"$node"})
        "0_3":
          kind: Panel
          spec:
            display:
              name: Workload utilization
              description: kubepods.slice usage / allocatable
            plugin:
              kind: StatChart
              spec:
                calculation: last-number
                format:
                  unit: percent
                  decimalPlaces: 1
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: |-
                        sum(container_memory_usage_bytes{id="/kubepods.slice", node=~"$node"})
                        /
                        sum(kube_node_status_allocatable{resource="memory", node=~"$node"})
        "0_4":
          kind: Panel
          spec:
            display:
              name: System used
              description: system.slice total usage (can exceed reserved via file cache)
            plugin:
              kind: StatChart
              spec:
                calculation: last-number
                format:
                  unit: bytes
                  decimalPlaces: 1
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: sum(container_memory_usage_bytes{id="/system.slice", node=~"$node"})
        "1_0":
          kind: Panel
          spec:
            display:
              name: Node Total
              description: 'Full node memory: system + workloads. Total height = node capacity.'
            plugin:
              kind: TimeSeriesChart
              spec:
                legend:
                  position: bottom
                  mode: list
                visual:
                  display: line
                  areaOpacity: 0.7
                  lineWidth: 2
                  stack: all
                querySettings:
                  - queryIndex: 5
                    colorMode: fixed-single
                    colorValue: '#FFFFFF'
                    lineStyle: dotted
                    stack: false
                    areaOpacity: 0
                yAxis:
                  format:
                    unit: bytes
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: |-
                        sum(container_memory_rss{id="/system.slice", node=~"$node"})
                        + sum(container_memory_rss{id="/kubepods.slice", node=~"$node"})
                      seriesNameFormat: Non-reclaimable (anon)
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: |-
                        (
                          sum(container_memory_usage_bytes{id="/system.slice", node=~"$node"})
                          + sum(container_memory_usage_bytes{id="/kubepods.slice", node=~"$node"})
                        )
                        - (
                          sum(container_memory_rss{id="/system.slice", node=~"$node"})
                          + sum(container_memory_rss{id="/kubepods.slice", node=~"$node"})
                        )
                        - (
                          sum(container_memory_total_active_file_bytes{id="/system.slice", node=~"$node"})
                          + sum(container_memory_total_active_file_bytes{id="/kubepods.slice", node=~"$node"})
                        )
                        - (
                          sum(container_memory_total_inactive_file_bytes{id="/system.slice", node=~"$node"})
                          + sum(container_memory_total_inactive_file_bytes{id="/kubepods.slice", node=~"$node"})
                        )
                      seriesNameFormat: Kernel overhead
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: |-
                        sum(container_memory_total_active_file_bytes{id="/system.slice", node=~"$node"})
                        + sum(container_memory_total_active_file_bytes{id="/kubepods.slice", node=~"$node"})
                      seriesNameFormat: Reclaimable hot (active file)
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: |-
                        sum(container_memory_total_inactive_file_bytes{id="/system.slice", node=~"$node"})
                        + sum(container_memory_total_inactive_file_bytes{id="/kubepods.slice", node=~"$node"})
                      seriesNameFormat: Reclaimable cold (inactive file)
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: |-
                        sum(kube_node_status_capacity{resource="memory", node=~"$node"})
                        - sum(container_memory_usage_bytes{id="/system.slice", node=~"$node"})
                        - sum(container_memory_usage_bytes{id="/kubepods.slice", node=~"$node"})
                      seriesNameFormat: Free
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: sum(kube_node_status_allocatable{resource="memory", node=~"$node"})
                      seriesNameFormat: ── Allocatable
        "1_1":
          kind: Panel
          spec:
            display:
              name: Workloads (kubepods.slice)
              description: Pod memory only. Total height = node allocatable.
            plugin:
              kind: TimeSeriesChart
              spec:
                legend:
                  position: bottom
                  mode: list
                visual:
                  display: line
                  areaOpacity: 0.7
                  stack: all
                yAxis:
                  format:
                    unit: bytes
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: sum(container_memory_rss{id="/kubepods.slice", node=~"$node"})
                      seriesNameFormat: Non-reclaimable (anon)
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: |-
                        sum(container_memory_usage_bytes{id="/kubepods.slice", node=~"$node"})
                        - sum(container_memory_rss{id="/kubepods.slice", node=~"$node"})
                        - sum(container_memory_total_active_file_bytes{id="/kubepods.slice", node=~"$node"})
                        - sum(container_memory_total_inactive_file_bytes{id="/kubepods.slice", node=~"$node"})
                      seriesNameFormat: Kernel overhead
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: sum(container_memory_total_active_file_bytes{id="/kubepods.slice", node=~"$node"})
                      seriesNameFormat: Reclaimable hot (active file)
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: sum(container_memory_total_inactive_file_bytes{id="/kubepods.slice", node=~"$node"})
                      seriesNameFormat: Reclaimable cold (inactive file)
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: |-
                        sum(kube_node_status_allocatable{resource="memory", node=~"$node"})
                        - sum(container_memory_usage_bytes{id="/kubepods.slice", node=~"$node"})
                      seriesNameFormat: Free
        "1_2":
          kind: Panel
          spec:
            display:
              name: System (system.slice)
              description: OS and Kubernetes system services. Compare with Reserved stat above — system usage commonly exceeds reservation due to file cache.
            plugin:
              kind: TimeSeriesChart
              spec:
                legend:
                  position: bottom
                  mode: list
                visual:
                  display: line
                  areaOpacity: 0.7
                  lineWidth: 2
                  stack: all
                querySettings:
                  - queryIndex: 4
                    colorMode: fixed-single
                    colorValue: '#FF8C00'
                    lineStyle: dotted
                    stack: false
                    areaOpacity: 0
                yAxis:
                  format:
                    unit: bytes
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: sum(container_memory_rss{id="/system.slice", node=~"$node"})
                      seriesNameFormat: Non-reclaimable (anon)
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: |-
                        sum(container_memory_usage_bytes{id="/system.slice", node=~"$node"})
                        - sum(container_memory_rss{id="/system.slice", node=~"$node"})
                        - sum(container_memory_total_active_file_bytes{id="/system.slice", node=~"$node"})
                        - sum(container_memory_total_inactive_file_bytes{id="/system.slice", node=~"$node"})
                      seriesNameFormat: Kernel overhead
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: sum(container_memory_total_active_file_bytes{id="/system.slice", node=~"$node"})
                      seriesNameFormat: Reclaimable hot (active file)
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: sum(container_memory_total_inactive_file_bytes{id="/system.slice", node=~"$node"})
                      seriesNameFormat: Reclaimable cold (inactive file)
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: |-
                        sum(kube_node_status_capacity{resource="memory", node=~"$node"})
                        - sum(kube_node_status_allocatable{resource="memory", node=~"$node"})
                      seriesNameFormat: ── Reserved
      layouts:
        - kind: Grid
          spec:
            display:
              title: Summary
            items:
              - x: 0
                "y": 0
                width: 4
                height: 8
                content:
                  $ref: '#/spec/panels/0_0'
              - x: 4
                "y": 0
                width: 4
                height: 8
                content:
                  $ref: '#/spec/panels/0_1'
              - x: 8
                "y": 0
                width: 4
                height: 8
                content:
                  $ref: '#/spec/panels/0_2'
              - x: 12
                "y": 0
                width: 4
                height: 8
                content:
                  $ref: '#/spec/panels/0_3'
              - x: 16
                "y": 0
                width: 4
                height: 8
                content:
                  $ref: '#/spec/panels/0_4'
        - kind: Grid
          spec:
            display:
              title: Memory Decomposition
            items:
              - x: 0
                "y": 0
                width: 8
                height: 14
                content:
                  $ref: '#/spec/panels/1_0'
              - x: 8
                "y": 0
                width: 8
                height: 14
                content:
                  $ref: '#/spec/panels/1_1'
              - x: 16
                "y": 0
                width: 8
                height: 14
                content:
                  $ref: '#/spec/panels/1_2'
      duration: 6h
  pod-memory.yaml: |
    kind: Dashboard
    metadata:
      name: pod-memory
      createdAt: "0001-01-01T00:00:00Z"
      project: openshift-operators
      updatedAt: "0001-01-01T00:00:00Z"
      version: 0
    spec:
      display:
        name: Pod Memory
        description: 'Container memory decomposition: non-reclaimable, hot/cold reclaimable, kernel overhead, with limit threshold.'
      variables:
        - kind: ListVariable
          spec:
            display:
              name: Namespace
              hidden: false
            name: namespace
            allowAllValue: false
            allowMultiple: false
            plugin:
              kind: PrometheusLabelValuesVariable
              spec:
                datasource:
                  kind: PrometheusDatasource
                labelName: namespace
                matchers:
                  - container_memory_working_set_bytes{}
        - kind: ListVariable
          spec:
            display:
              name: Pod
              hidden: false
            name: pod
            allowAllValue: true
            allowMultiple: false
            plugin:
              kind: PrometheusLabelValuesVariable
              spec:
                datasource:
                  kind: PrometheusDatasource
                labelName: pod
                matchers:
                  - container_memory_working_set_bytes{namespace=~"$namespace",container!="",container!="POD"}
        - kind: ListVariable
          spec:
            display:
              name: Container
              hidden: false
            name: container
            allowAllValue: true
            allowMultiple: false
            plugin:
              kind: PrometheusLabelValuesVariable
              spec:
                datasource:
                  kind: PrometheusDatasource
                labelName: container
                matchers:
                  - container_memory_working_set_bytes{namespace=~"$namespace",pod=~"$pod",container!="",container!="POD"}
      panels:
        "0_0":
          kind: Panel
          spec:
            display:
              name: Working Set
              description: Memory that cannot be freely reclaimed (usage minus inactive file cache). This is what the kubelet uses for eviction and OOM decisions.
            plugin:
              kind: StatChart
              spec:
                calculation: last-number
                format:
                  unit: bytes
                  decimalPlaces: 1
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: sum(container_memory_working_set_bytes{namespace=~"$namespace", pod=~"$pod", container=~"$container", container!="POD", container!=""})
        "0_1":
          kind: Panel
          spec:
            display:
              name: Memory Limit
            plugin:
              kind: StatChart
              spec:
                calculation: last-number
                format:
                  unit: bytes
                  decimalPlaces: 1
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: sum(kube_pod_container_resource_limits{resource="memory", namespace=~"$namespace", pod=~"$pod", container=~"$container"})
        "0_2":
          kind: Panel
          spec:
            display:
              name: Utilization
              description: working_set / limit — how close to OOM
            plugin:
              kind: StatChart
              spec:
                calculation: last-number
                format:
                  unit: percent
                  decimalPlaces: 1
                thresholds:
                  steps:
                    - value: 0
                      color: '#32ac2d'
                    - value: 0.80
                      color: '#ed8128'
                    - value: 0.95
                      color: '#f53636'
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: |-
                        sum(container_memory_working_set_bytes{namespace=~"$namespace", pod=~"$pod", container=~"$container", container!="POD", container!=""})
                        /
                        sum(kube_pod_container_resource_limits{resource="memory", namespace=~"$namespace", pod=~"$pod", container=~"$container"})
        "0_3":
          kind: Panel
          spec:
            display:
              name: RSS
              description: Anonymous memory (heap, stack). Cannot be reclaimed without swap — primary driver of OOM kills.
            plugin:
              kind: StatChart
              spec:
                calculation: last-number
                format:
                  unit: bytes
                  decimalPlaces: 1
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: sum(container_memory_rss{namespace=~"$namespace", pod=~"$pod", container=~"$container", container!="POD", container!=""})
        "1_0":
          kind: Panel
          spec:
            display:
              name: Memory Breakdown
              description: Stacked memory usage with limit threshold. Total height = container_memory_usage_bytes.
            plugin:
              kind: TimeSeriesChart
              spec:
                legend:
                  position: bottom
                  mode: list
                visual:
                  display: line
                  areaOpacity: 0.7
                  lineWidth: 2
                  stack: all
                querySettings:
                  - queryIndex: 4
                    colorMode: fixed-single
                    colorValue: '#FFFFFF'
                    lineStyle: dotted
                    stack: false
                    areaOpacity: 0
                yAxis:
                  format:
                    unit: bytes
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: sum(container_memory_rss{namespace=~"$namespace", pod=~"$pod", container=~"$container", container!="POD", container!=""})
                      seriesNameFormat: Non-reclaimable (anon/RSS)
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: |-
                        sum(container_memory_usage_bytes{namespace=~"$namespace", pod=~"$pod", container=~"$container", container!="POD", container!=""})
                        - sum(container_memory_rss{namespace=~"$namespace", pod=~"$pod", container=~"$container", container!="POD", container!=""})
                        - sum(container_memory_cache{namespace=~"$namespace", pod=~"$pod", container=~"$container", container!="POD", container!=""})
                      seriesNameFormat: Kernel overhead
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: |-
                        sum(container_memory_cache{namespace=~"$namespace", pod=~"$pod", container=~"$container", container!="POD", container!=""})
                        - (
                          sum(container_memory_usage_bytes{namespace=~"$namespace", pod=~"$pod", container=~"$container", container!="POD", container!=""})
                          - sum(container_memory_working_set_bytes{namespace=~"$namespace", pod=~"$pod", container=~"$container", container!="POD", container!=""})
                        )
                      seriesNameFormat: Reclaimable hot (active file)
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: |-
                        sum(container_memory_usage_bytes{namespace=~"$namespace", pod=~"$pod", container=~"$container", container!="POD", container!=""})
                        - sum(container_memory_working_set_bytes{namespace=~"$namespace", pod=~"$pod", container=~"$container", container!="POD", container!=""})
                      seriesNameFormat: Reclaimable cold (inactive file)
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: sum(kube_pod_container_resource_limits{resource="memory", namespace=~"$namespace", pod=~"$pod", container=~"$container"})
                      seriesNameFormat: ── Memory Limit
      layouts:
        - kind: Grid
          spec:
            display:
              title: Summary
            items:
              - x: 0
                "y": 0
                width: 6
                height: 8
                content:
                  $ref: '#/spec/panels/0_0'
              - x: 6
                "y": 0
                width: 6
                height: 8
                content:
                  $ref: '#/spec/panels/0_1'
              - x: 12
                "y": 0
                width: 6
                height: 8
                content:
                  $ref: '#/spec/panels/0_2'
              - x: 18
                "y": 0
                width: 6
                height: 8
                content:
                  $ref: '#/spec/panels/0_3'
        - kind: Grid
          spec:
            display:
              title: Memory Decomposition
            items:
              - x: 0
                "y": 0
                width: 24
                height: 16
                content:
                  $ref: '#/spec/panels/1_0'
      duration: 6h
  vm-capacity.yaml: |
    kind: Dashboard
    metadata:
      name: vm-capacity
      createdAt: "0001-01-01T00:00:00Z"
      project: openshift-operators
      updatedAt: "0001-01-01T00:00:00Z"
      version: 0
    spec:
      display:
        name: How many VMs fit
        description: How many more virtual machines of a chosen shape fit in the remaining schedulable capacity.
      variables:
        - kind: ListVariable
          spec:
            display:
              name: VM memory
              hidden: false
            defaultValue:
              singleValue: "8589934592"
              sliceValues: []
            name: vm_memory
            allowAllValue: false
            allowMultiple: false
            plugin:
              kind: StaticListVariable
              spec:
                values:
                  - value: "4294967296"
                    label: 4 GiB
                  - value: "8589934592"
                    label: 8 GiB
                  - value: "17179869184"
                    label: 16 GiB
                  - value: "34359738368"
                    label: 32 GiB
                  - value: "68719476736"
                    label: 64 GiB
        - kind: ListVariable
          spec:
            display:
              name: VM CPU
              hidden: false
            defaultValue:
              singleValue: "4"
              sliceValues: []
            name: vm_cpu
            allowAllValue: false
            allowMultiple: false
            plugin:
              kind: StaticListVariable
              spec:
                values:
                  - value: "1"
                    label: 1 vCPU
                  - value: "2"
                    label: 2 vCPU
                  - value: "4"
                    label: 4 vCPU
                  - value: "8"
                    label: 8 vCPU
                  - value: "16"
                    label: 16 vCPU
        - kind: ListVariable
          spec:
            display:
              name: Memory overcommit
              hidden: false
            defaultValue:
              singleValue: "1"
              sliceValues: []
            name: memory_overcommit
            allowAllValue: false
            allowMultiple: false
            plugin:
              kind: StaticListVariable
              spec:
                values:
                  - "1"
                  - "1.5"
                  - "2"
                  - "2.5"
                  - "3"
                  - "4"
        - kind: ListVariable
          spec:
            display:
              name: CPU overcommit
              hidden: false
            defaultValue:
              singleValue: "1"
              sliceValues: []
            name: cpu_overcommit
            allowAllValue: false
            allowMultiple: false
            plugin:
              kind: StaticListVariable
              spec:
                values:
                  - "1"
                  - "2"
                  - "4"
                  - "6"
                  - "8"
                  - "10"
                  - "12"
      panels:
        "0_0":
          kind: Panel
          spec:
            display:
              name: VMs that fit
            plugin:
              kind: StatChart
              spec:
                calculation: last-number
                format:
                  unit: decimal
                  decimalPlaces: 0
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: |-
                        floor(clamp_max(
                          cluster:available_capacity_memory:bytes / $vm_memory * $memory_overcommit,
                          scalar(cluster:available_capacity_cpu:cores / $vm_cpu * $cpu_overcommit)
                        ))
        "0_1":
          kind: Panel
          spec:
            display:
              name: Limited by
              description: Whether remaining capacity runs out of memory or CPU first for the selected VM shape.
            plugin:
              kind: StatChart
              spec:
                calculation: last-number
                format:
                  unit: decimal
                  decimalPlaces: 0
                mappings:
                  - kind: Range
                    spec:
                      from: 0
                      to: 0.5
                      result:
                        value: Memory bound
                  - kind: Range
                    spec:
                      from: 0.5
                      to: 1.5
                      result:
                        value: CPU bound
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: |-
                        (
                          cluster:available_capacity_memory:bytes / $vm_memory * $memory_overcommit
                          > bool
                          scalar(cluster:available_capacity_cpu:cores / $vm_cpu * $cpu_overcommit)
                        )
        "0_2":
          kind: Panel
          spec:
            display:
              name: Memory / CPU
              description: GiB of memory request per CPU request. The node shape that matches the current workload.
            plugin:
              kind: StatChart
              spec:
                calculation: last-number
                format:
                  unit: decimal
                  decimalPlaces: 2
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: cluster:memory_cpu_ratio:gib_per_core
                      seriesNameFormat: GiB per core
        "1_0":
          kind: Panel
          spec:
            display:
              name: Memory
            plugin:
              kind: TimeSeriesChart
              spec:
                legend:
                  position: bottom
                  mode: list
                visual:
                  display: bar
                  stack: all
                yAxis:
                  format:
                    unit: bytes
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: cluster:non_vm_used_capacity_memory:bytes
                      seriesNameFormat: Non-VM used
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: cluster:vm_used_capacity_memory:bytes
                      seriesNameFormat: VM used
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: cluster:available_capacity_memory:bytes
                      seriesNameFormat: Available
        "1_1":
          kind: Panel
          spec:
            display:
              name: CPU
            plugin:
              kind: TimeSeriesChart
              spec:
                legend:
                  position: bottom
                  mode: list
                visual:
                  display: bar
                  stack: all
                yAxis:
                  format:
                    unit: decimal
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: cluster:non_vm_used_capacity_cpu:cores
                      seriesNameFormat: Non-VM used
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: cluster:vm_used_capacity_cpu:cores
                      seriesNameFormat: VM used
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: cluster:available_capacity_cpu:cores
                      seriesNameFormat: Available
      layouts:
        - kind: Grid
          spec:
            display:
              title: How many more VMs fit
            items:
              - x: 0
                "y": 0
                width: 8
                height: 8
                content:
                  $ref: '#/spec/panels/0_0'
              - x: 8
                "y": 0
                width: 8
                height: 8
                content:
                  $ref: '#/spec/panels/0_1'
              - x: 16
                "y": 0
                width: 8
                height: 8
                content:
                  $ref: '#/spec/panels/0_2'
        - kind: Grid
          spec:
            display:
              title: Capacity
            items:
              - x: 0
                "y": 0
                width: 12
                height: 12
                content:
                  $ref: '#/spec/panels/1_0'
              - x: 12
                "y": 0
                width: 12
                height: 12
                content:
                  $ref: '#/spec/panels/1_1'
      duration: 1h
  vm-memory.yaml: |
    kind: Dashboard
    metadata:
      name: vm-memory
      createdAt: "0001-01-01T00:00:00Z"
      project: openshift-operators
      updatedAt: "0001-01-01T00:00:00Z"
      version: 0
    spec:
      display:
        name: VM Memory
        description: Guest memory decomposition (kernel, non-reclaimable, reclaimable, free) and launcher pod memory budget vs actual.
      variables:
        - kind: ListVariable
          spec:
            display:
              name: Namespace
              hidden: false
            name: namespace
            allowAllValue: false
            allowMultiple: false
            plugin:
              kind: PrometheusLabelValuesVariable
              spec:
                datasource:
                  kind: PrometheusDatasource
                labelName: namespace
                matchers:
                  - kubevirt_vmi_memory_available_bytes{}
        - kind: ListVariable
          spec:
            display:
              name: VM
              hidden: false
            name: vm
            allowAllValue: false
            allowMultiple: false
            plugin:
              kind: PrometheusLabelValuesVariable
              spec:
                datasource:
                  kind: PrometheusDatasource
                labelName: name
                matchers:
                  - kubevirt_vmi_memory_available_bytes{namespace=~"$namespace"}
      panels:
        "0_0":
          kind: Panel
          spec:
            display:
              name: Domain
              description: Total memory allocated to the QEMU domain — the VM's configured size.
            plugin:
              kind: StatChart
              spec:
                calculation: last-number
                format:
                  unit: bytes
                  decimalPlaces: 1
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: kubevirt_vmi_memory_domain_bytes{name=~"$vm", namespace=~"$namespace"}
        "0_1":
          kind: Panel
          spec:
            display:
              name: Available (MemTotal)
              description: Usable memory inside the guest — domain minus kernel reserved.
            plugin:
              kind: StatChart
              spec:
                calculation: last-number
                format:
                  unit: bytes
                  decimalPlaces: 1
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: kubevirt_vmi_memory_available_bytes{name=~"$vm", namespace=~"$namespace"}
        "0_2":
          kind: Panel
          spec:
            display:
              name: Used (non-reclaimable)
              description: Memory actively in use — cannot be freed without swap or OOM.
            plugin:
              kind: StatChart
              spec:
                calculation: last-number
                format:
                  unit: bytes
                  decimalPlaces: 1
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: kubevirt_vmi_memory_used_bytes{name=~"$vm", namespace=~"$namespace"}
        "0_3":
          kind: Panel
          spec:
            display:
              name: Utilization
              description: used / available — how close to guest OOM.
            plugin:
              kind: StatChart
              spec:
                calculation: last-number
                format:
                  unit: percent-decimal
                  decimalPlaces: 1
                thresholds:
                  steps:
                    - value: 0
                      color: '#32ac2d'
                    - value: 80
                      color: '#ed8128'
                    - value: 95
                      color: '#f53636'
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: |-
                        kubevirt_vmi_memory_used_bytes{name=~"$vm", namespace=~"$namespace"}
                        / kubevirt_vmi_memory_available_bytes{name=~"$vm", namespace=~"$namespace"} * 100
        "0_4":
          kind: Panel
          spec:
            display:
              name: Pod Margin
              description: Pod memory request minus actual working_set. Positive = headroom. Negative = over budget, risk of eviction.
            plugin:
              kind: StatChart
              spec:
                calculation: last-number
                format:
                  unit: bytes
                  decimalPlaces: 1
                thresholds:
                  steps:
                    - value: -536870912
                      color: '#f53636'
                    - value: 0
                      color: '#ed8128'
                    - value: 104857600
                      color: '#32ac2d'
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: kubevirt_vm_container_memory_request_margin_based_on_working_set_bytes{namespace=~"$namespace", pod=~"virt-launcher-$vm-.*"}
        "1_0":
          kind: Panel
          spec:
            display:
              name: Guest Memory Decomposition
              description: 'Four layers summing to domain: kernel reserved + non-reclaimable + reclaimable + free.'
            plugin:
              kind: TimeSeriesChart
              spec:
                legend:
                  position: bottom
                  mode: list
                visual:
                  display: line
                  areaOpacity: 0.7
                  lineWidth: 2
                  stack: all
                querySettings:
                  - queryIndex: 4
                    colorMode: fixed-single
                    colorValue: '#FFFFFF'
                    lineStyle: dotted
                    stack: false
                    areaOpacity: 0
                yAxis:
                  format:
                    unit: bytes
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: |-
                        kubevirt_vmi_memory_domain_bytes{name=~"$vm", namespace=~"$namespace"}
                        - kubevirt_vmi_memory_available_bytes{name=~"$vm", namespace=~"$namespace"}
                      seriesNameFormat: Kernel reserved
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: kubevirt_vmi_memory_used_bytes{name=~"$vm", namespace=~"$namespace"}
                      seriesNameFormat: Non-reclaimable (used)
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: kubevirt_vmi_memory_usable_bytes{name=~"$vm", namespace=~"$namespace"} - kubevirt_vmi_memory_unused_bytes{name=~"$vm", namespace=~"$namespace"}
                      seriesNameFormat: Reclaimable
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: kubevirt_vmi_memory_unused_bytes{name=~"$vm", namespace=~"$namespace"}
                      seriesNameFormat: Free
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: kubevirt_vmi_memory_domain_bytes{name=~"$vm", namespace=~"$namespace"}
                      seriesNameFormat: ── Domain (configured)
        "1_1":
          kind: Panel
          spec:
            display:
              name: 'Pod Memory: Budget vs Actual'
              description: Budget = domain + estimated overhead (pod memory request). Actual = pod working_set. When actual exceeds budget the pod is at risk of eviction.
            plugin:
              kind: TimeSeriesChart
              spec:
                legend:
                  position: bottom
                  mode: list
                querySettings:
                  - queryIndex: 0
                    colorMode: fixed-single
                    colorValue: '#32ac2d'
                    lineStyle: dotted
                  - queryIndex: 1
                    colorMode: fixed-single
                    colorValue: '#2E79B5'
                visual:
                  display: line
                  areaOpacity: 0
                  lineWidth: 2
                yAxis:
                  format:
                    unit: bytes
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: |-
                        scalar(kubevirt_vmi_memory_domain_bytes{name=~"$vm", namespace=~"$namespace"})
                        + scalar(kubevirt_vmi_launcher_memory_overhead_bytes{name=~"$vm", namespace=~"$namespace"})
                      seriesNameFormat: Budget (domain + overhead estimate)
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: container_memory_working_set_bytes{namespace=~"$namespace", pod=~"virt-launcher-$vm-.*", container=""}
                      seriesNameFormat: Actual (pod working_set)
      layouts:
        - kind: Grid
          spec:
            display:
              title: Summary
            items:
              - x: 0
                "y": 0
                width: 4
                height: 8
                content:
                  $ref: '#/spec/panels/0_0'
              - x: 4
                "y": 0
                width: 4
                height: 8
                content:
                  $ref: '#/spec/panels/0_1'
              - x: 8
                "y": 0
                width: 4
                height: 8
                content:
                  $ref: '#/spec/panels/0_2'
              - x: 12
                "y": 0
                width: 4
                height: 8
                content:
                  $ref: '#/spec/panels/0_3'
              - x: 16
                "y": 0
                width: 4
                height: 8
                content:
                  $ref: '#/spec/panels/0_4'
        - kind: Grid
          spec:
            display:
              title: Memory Decomposition
            items:
              - x: 0
                "y": 0
                width: 12
                height: 8
                content:
                  $ref: '#/spec/panels/1_0'
              - x: 12
                "y": 0
                width: 12
                height: 8
                content:
                  $ref: '#/spec/panels/1_1'
      duration: 6h
  vm-overcommit.yaml: |
    kind: Dashboard
    metadata:
      name: vm-overcommit
      createdAt: "0001-01-01T00:00:00Z"
      project: openshift-operators
      updatedAt: "0001-01-01T00:00:00Z"
      version: 0
    spec:
      display:
        name: VM Overcommit
        description: Suggested cluster overcommit ratios from granted vs actual VM usage, and the VMs with the largest unused allocation.
      variables:
        - kind: ListVariable
          spec:
            display:
              name: Observation period
              hidden: false
            defaultValue:
              singleValue: 30d
              sliceValues: []
            name: observation_period
            allowAllValue: false
            allowMultiple: false
            plugin:
              kind: StaticListVariable
              spec:
                values:
                  - value: 7d
                    label: 7 days
                  - value: 30d
                    label: 30 days
                  - value: 180d
                    label: 180 days
                  - value: 360d
                    label: 360 days
        - kind: ListVariable
          spec:
            display:
              name: Memory quantile
              hidden: false
            defaultValue:
              singleValue: "0.95"
              sliceValues: []
            name: memory_quantile
            allowAllValue: false
            allowMultiple: false
            plugin:
              kind: StaticListVariable
              spec:
                values:
                  - value: "0.80"
                    label: "80"
                  - value: "0.85"
                    label: "85"
                  - value: "0.90"
                    label: "90"
                  - value: "0.95"
                    label: "95"
                  - value: "0.99"
                    label: "99"
                  - value: "1"
                    label: "100"
        - kind: ListVariable
          spec:
            display:
              name: CPU quantile
              hidden: false
            defaultValue:
              singleValue: "0.80"
              sliceValues: []
            name: cpu_quantile
            allowAllValue: false
            allowMultiple: false
            plugin:
              kind: StaticListVariable
              spec:
                values:
                  - value: "0.60"
                    label: "60"
                  - value: "0.70"
                    label: "70"
                  - value: "0.80"
                    label: "80"
                  - value: "0.85"
                    label: "85"
                  - value: "0.90"
                    label: "90"
                  - value: "0.95"
                    label: "95"
      panels:
        "0_0":
          kind: Panel
          spec:
            display:
              name: Memory
              description: Total guest domain memory divided by the selected percentile of used memory over the observation period.
            plugin:
              kind: StatChart
              spec:
                calculation: last-number
                format:
                  unit: decimal
                  decimalPlaces: 2
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: |-
                        sum(kubevirt_vmi_memory_domain_bytes)
                        /
                        sum(
                          quantile_over_time($memory_quantile, kubevirt_vmi_memory_used_bytes[$observation_period])
                        )
                      seriesNameFormat: memory overcommit
                      minStep: 5m
        "0_1":
          kind: Panel
          spec:
            display:
              name: CPU
              description: Total allocated vCPUs divided by the selected percentile of QEMU CPU usage over the observation period.
            plugin:
              kind: StatChart
              spec:
                calculation: last-number
                format:
                  unit: decimal
                  decimalPlaces: 2
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: |-
                        sum(vmi:kubevirt_vmi_vcpu:count)
                        /
                        sum(
                          quantile_over_time(
                            $cpu_quantile,
                            rate(kubevirt_vmi_cpu_usage_seconds_total[5m])[$observation_period:5m]
                          )
                        )
                      seriesNameFormat: cpu overcommit
                      minStep: 5m
        "1_0":
          kind: Panel
          spec:
            display:
              name: Memory
              description: The ten VMs whose domain memory is largest relative to used memory over the observation period.
            plugin:
              kind: Table
              spec:
                density: compact
                columnSettings:
                  - name: namespace
                    header: Namespace
                    enableSorting: true
                  - name: name
                    header: VM
                    enableSorting: true
                  - name: value
                    header: Overcommit ratio
                    enableSorting: true
                    format:
                      unit: decimal
                      decimalPlaces: 2
                    sort: desc
                  - name: timestamp
                    hide: true
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: |-
                        topk(10,
                          sum by (namespace, name) (kubevirt_vmi_memory_domain_bytes)
                          /
                          sum by (namespace, name) (
                            quantile_over_time($memory_quantile, kubevirt_vmi_memory_used_bytes[$observation_period])
                          )
                        )
                      seriesNameFormat: '{{namespace}}/{{name}}'
                      minStep: 5m
        "1_1":
          kind: Panel
          spec:
            display:
              name: CPU
              description: The ten VMs whose allocated vCPUs are largest relative to QEMU CPU usage over the observation period.
            plugin:
              kind: Table
              spec:
                density: compact
                columnSettings:
                  - name: namespace
                    header: Namespace
                    enableSorting: true
                  - name: name
                    header: VM
                    enableSorting: true
                  - name: value
                    header: Overcommit ratio
                    enableSorting: true
                    format:
                      unit: decimal
                      decimalPlaces: 2
                    sort: desc
                  - name: timestamp
                    hide: true
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      query: |-
                        topk(10,
                          sum by (namespace, name) (vmi:kubevirt_vmi_vcpu:count)
                          /
                          sum by (namespace, name) (
                            quantile_over_time(
                              $cpu_quantile,
                              rate(kubevirt_vmi_cpu_usage_seconds_total[5m])[$observation_period:5m]
                            )
                          )
                        )
                      seriesNameFormat: '{{namespace}}/{{name}}'
                      minStep: 5m
      layouts:
        - kind: Grid
          spec:
            display:
              title: Suggested overcommit
            items:
              - x: 0
                "y": 0
                width: 12
                height: 8
                content:
                  $ref: '#/spec/panels/0_0'
              - x: 12
                "y": 0
                width: 12
                height: 8
                content:
                  $ref: '#/spec/panels/0_1'
        - kind: Grid
          spec:
            display:
              title: Most overestimated VMs
            items:
              - x: 0
                "y": 0
                width: 12
                height: 12
                content:
                  $ref: '#/spec/panels/1_0'
              - x: 12
                "y": 0
                width: 12
                height: 12
                content:
                  $ref: '#/spec/panels/1_1'
      duration: 5m
kind: ConfigMap
metadata:
  name: perses-ui-dashboards
  namespace: openshift-operators
