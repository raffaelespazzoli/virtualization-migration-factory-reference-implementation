apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: perses

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - clusterrolebinding.yaml
  - config-configmap.yaml
  - ca-bundle-configmap.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - consolelink.yaml
  # Dashboards from upstream — defaults to PersesDashboard CRs.
  # To switch to ConfigMap mode (for standalone Perses), change the
  # last patch in the upstream kustomization from wrap-perses-dashboard.yaml
  # to wrap-configmap.yaml.
  - github.com/raffaelespazzoli/openshift-monitoring-addson//dashboards?ref=main
