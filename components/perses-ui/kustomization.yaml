apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: perses

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - clusterrolebinding.yaml
  - config-configmap.yaml
  - ca-bundle-configmap.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - consolelink.yaml

# Dashboard files from upstream, assembled into a single ConfigMap
# for Perses file-based provisioning.
#
# Source of truth: https://github.com/raffaelespazzoli/openshift-monitoring-addson
# Pin to a tag or commit SHA for production stability:
#   https://raw.githubusercontent.com/raffaelespazzoli/openshift-monitoring-addson/<ref>/dashboards/dac/built/<file>
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: perses-ui

configMapGenerator:
  - name: perses-ui-dashboards
    files:
      - capacity-exhaustion.yaml=https://raw.githubusercontent.com/raffaelespazzoli/openshift-monitoring-addson/main/dashboards/dac/built/capacity-exhaustion_output.yaml
      - node-resources.yaml=https://raw.githubusercontent.com/raffaelespazzoli/openshift-monitoring-addson/main/dashboards/dac/built/node-resources_output.yaml
      - pod-memory.yaml=https://raw.githubusercontent.com/raffaelespazzoli/openshift-monitoring-addson/main/dashboards/dac/built/pod-resources_output.yaml
      - vm-capacity.yaml=https://raw.githubusercontent.com/raffaelespazzoli/openshift-monitoring-addson/main/dashboards/dac/built/vm-capacity_output.yaml
      - vm-memory.yaml=https://raw.githubusercontent.com/raffaelespazzoli/openshift-monitoring-addson/main/dashboards/dac/built/vm-resources_output.yaml
      - vm-overcommit.yaml=https://raw.githubusercontent.com/raffaelespazzoli/openshift-monitoring-addson/main/dashboards/dac/built/vm-overcommit_output.yaml
