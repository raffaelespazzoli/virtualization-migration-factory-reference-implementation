apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: thanos-bucket-web-global
spec:
  host: thanos-bucket-web.global.${PLATFORM_BASE_DOMAIN}
  port:
    targetPort: https
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
    externalCertificate:
      name: thanos-global-bw-tls
  to:
    kind: Service
    name: thanos-bucketweb
    weight: 100
  wildcardPolicy: None
