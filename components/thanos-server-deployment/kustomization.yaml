apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: thanos-system

resources:
  - namespace.yaml
  - objstore-secret.yaml
  - query-frontend-route.yaml
  - bucket-web-route.yaml
  - service-ca-bundle.yaml
  - compactor-safety-vap.yaml
  - ruler-rbac-namespace-scope.yaml
  - storegateway-index-cache-config.yaml
  - rbac-proxy-config.yaml
  - rbac.yaml
  - global-routes-certificate.yaml
  #- global-query-frontend-route.yaml
  #- global-bucket-web-route.yaml
  - router-certs-rbac.yaml
  - consolelink-query-frontend.yaml
  - consolelink-bucket-web.yaml
  - thanos-custom-rules.yaml
  - query-combined-ca.yaml
  - query-http-config.yaml
  - qf-downstream-tls.yaml
  - bucketweb-oauth-sa.yaml
  - bucketweb-oauth-cookie.yaml
  - bucketweb-oauth-ca-bundle.yaml

# Delete the chart-generated ClusterRole/ClusterRoleBinding — replaced by
# the namespace-scoped Role/RoleBinding in ruler-rbac-namespace-scope.yaml
patches:
  - target:
      group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: thanos-ruler-rule-importer
    patch: |
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: thanos-ruler-rule-importer
  - target:
      group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
      name: thanos-ruler-rule-importer
    patch: |
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: thanos-ruler-rule-importer
  # Expose the auth-proxy HTTPS port (9091) on the chart-generated services.
  # The chart only creates ports for the main container; the reencrypt routes
  # need to reach the sidecar port.
  - target:
      kind: Service
      name: thanos-query-frontend
    patch: |
      - op: add
        path: /spec/ports/-
        value:
          name: https
          port: 9091
          targetPort: 9091
          protocol: TCP
  - target:
      kind: Service
      name: thanos-bucketweb
    patch: |
      - op: add
        path: /spec/ports/-
        value:
          name: https
          port: 9091
          targetPort: 9091
          protocol: TCP
  # The Ruler ClusterIP service only exposes http:10902. Query connects to
  # the gRPC StoreAPI on port 10901, so we must add it.
  - target:
      kind: Service
      name: thanos-ruler
    patch: |
      - op: add
        path: /spec/ports/-
        value:
          name: grpc
          port: 10901
          targetPort: 10901
          protocol: TCP
  # The chart generates scheme: https from the URL but does not emit
  # http_config.tls_config. Patch the ConfigMap to add the service CA.
  - target:
      kind: ConfigMap
      name: thanos-ruler-query
    patch: |
      - op: replace
        path: /data/query-urls.yaml
        value: |
          - static_configs:
              - thanos-query.thanos-system.svc.cluster.local:9090
            scheme: https
            http_config:
              tls_config:
                ca_file: /etc/tls/service-ca/service-ca.crt
  # The rule-importer sidecar script uses `-A` (all namespaces) which needs
  # a ClusterRole. We only grant a namespace-scoped Role, so restrict the
  # lookup to thanos-system. This keeps the SA least-privilege.
  - target:
      kind: ConfigMap
      name: thanos-ruler-rule-importer
    patch: |
      - op: replace
        path: /data/import.sh
        value: |
          set -e

          SELECTOR="thanos-ruler=true"
          NAMESPACE="thanos-system"

          if [ -z "$SELECTOR" ]; then
            echo "No label selector provided, importing ALL PrometheusRules"
            SELECTOR_ARG=""
          else
            echo "Using label selector: $SELECTOR"
            SELECTOR_ARG="-l $SELECTOR"
          fi

          PREV_SUM=""

          while true; do
            echo "Syncing PrometheusRules"

            rm -f /generated/*.yaml || true

            kubectl get prometheusrules.monitoring.coreos.com -n $NAMESPACE $SELECTOR_ARG \
              -o jsonpath='{range .items[*]}{.metadata.name}|{.metadata.namespace}{"\n"}{end}' | \
            while read line; do
              name=$(echo "$line" | cut -d"|" -f1)
              ns=$(echo "$line" | cut -d"|" -f2)

              echo "Processing $ns/$name"

              kubectl get prometheusrule "$name" -n "$ns" -o jsonpath='{.spec}' \
                > "/generated/${ns}-${name}.yaml"
            done

            CURRENT_SUM=$(find /generated -type f -name '*.yaml' -exec cat {} + 2>/dev/null | md5sum | cut -d' ' -f1)
            if [ "$CURRENT_SUM" != "$PREV_SUM" ]; then
              echo "Rule files changed, triggering Thanos Ruler reload"
              if curl -sf -X POST http://localhost:10902/-/reload; then
                PREV_SUM="$CURRENT_SUM"
              else
                echo "Failed to reload Thanos Ruler, will retry next cycle"
              fi
            fi

            sleep 60
          done
  # Bucket Web pods must run as the oauth-proxy SA so the OAuth redirect
  # annotation is honoured.
  - target:
      kind: Deployment
      name: thanos-bucketweb
    patch: |
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: thanos-bucketweb-oauth

helmGlobals:
  chartHome: ../../.helm-charts

helmCharts:
  - name: thanos
    releaseName: thanos
    namespace: thanos-system
    valuesFile: values.yaml
  - name: memcached
    releaseName: thanos-memcached-qf
    namespace: thanos-system
    valuesFile: values-memcached-qf.yaml
  - name: memcached
    releaseName: thanos-memcached-store
    namespace: thanos-system
    valuesFile: values-memcached-store.yaml
