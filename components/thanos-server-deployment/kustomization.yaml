apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: thanos-system

resources:
  - namespace.yaml
  - objstore-secret.yaml
  - query-frontend-route.yaml
  - bucket-web-route.yaml
  - service-ca-bundle.yaml
  - compactor-safety-vap.yaml
  - ruler-rbac-namespace-scope.yaml
  - storegateway-index-cache-config.yaml
  - rbac-proxy-config.yaml
  - rbac.yaml
  - global-routes-certificate.yaml
  #- global-query-frontend-route.yaml
  #- global-bucket-web-route.yaml
  - router-certs-rbac.yaml
  - consolelink-query-frontend.yaml
  - consolelink-bucket-web.yaml

# Delete the chart-generated ClusterRole/ClusterRoleBinding — replaced by
# the namespace-scoped Role/RoleBinding in ruler-rbac-namespace-scope.yaml
patches:
  - target:
      group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: thanos-ruler-rule-importer
    patch: |
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: thanos-ruler-rule-importer
  - target:
      group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
      name: thanos-ruler-rule-importer
    patch: |
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: thanos-ruler-rule-importer
  # Expose the kube-rbac-proxy sidecar port on the chart-generated services.
  # The Bitnami chart only creates ports for the main container; the reencrypt
  # routes need to reach the sidecar's HTTPS port (9091).
  - target:
      kind: Service
      name: thanos-query-frontend
    patch: |
      - op: add
        path: /spec/ports/-
        value:
          name: https
          port: 9091
          targetPort: 9091
          protocol: TCP
  - target:
      kind: Service
      name: thanos-bucketweb
    patch: |
      - op: add
        path: /spec/ports/-
        value:
          name: https
          port: 9091
          targetPort: 9091
          protocol: TCP

helmGlobals:
  chartHome: ../../.helm-charts

helmCharts:
  - name: thanos
    releaseName: thanos
    namespace: thanos-system
    valuesFile: values.yaml
  - name: memcached
    releaseName: thanos-memcached-qf
    namespace: thanos-system
    valuesFile: values-memcached-qf.yaml
  - name: memcached
    releaseName: thanos-memcached-store
    namespace: thanos-system
    valuesFile: values-memcached-store.yaml
