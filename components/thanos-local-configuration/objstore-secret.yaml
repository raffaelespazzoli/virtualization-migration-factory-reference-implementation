apiVersion: v1
kind: Secret
metadata:
  name: thanos-objstore
type: Opaque
stringData:
  objstore.yml: |
    type: S3
    config:
      bucket: thanos
      endpoint: thanos-s3-api-thanos-garage.apps.${HUB_BASE_DOMAIN}
      access_key: thanosadmin
      secret_key: thanosthanos
      region: garage
      insecure: false
      http_config:
        tls_config:
          insecure_skip_verify: false
