apiVersion: v1
kind: Secret
metadata:
  name: thanos-objstore
type: Opaque
stringData:
  objstore.yml: |
    type: S3
    config:
      bucket: thanos
      endpoint: thanos-minio-api-thanos-minio.apps.${HUB_BASE_DOMAIN}
      access_key: thanos
      secret_key: thanosthanos
      insecure: false
      http_config:
        tls_config:
          insecure_skip_verify: false
