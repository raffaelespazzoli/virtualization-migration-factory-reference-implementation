apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: thanos-local

resources:
  - namespace.yaml
  - objstore-secret.yaml
  #- otel-metrics-collector.yaml
  - receive-route.yaml
  - service-ca-bundle.yaml
  - rbac.yaml

# The chart-generated Receive ClusterIP service only exposes http and
# remote-write ports. Query connects to the gRPC StoreAPI on 10901.
patches:
  - target:
      kind: Service
      name: thanos-receive
    patch: |
      - op: add
        path: /spec/ports/-
        value:
          name: grpc
          port: 10901
          targetPort: 10901
          protocol: TCP

helmGlobals:
  chartHome: ../../.helm-charts

helmCharts:
  - name: thanos
    releaseName: thanos
    namespace: thanos-local
    valuesFile: values-receive.yaml
