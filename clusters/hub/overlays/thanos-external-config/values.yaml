tenant:
  configSecret:
    name: thanos-minio-env-configuration
    accessKey: thanos
    secretKey: thanosthanos
  configuration:
    name: thanos-minio-env-configuration
  name: thanos
  # Image is overridden by kustomize patch (digest pin) — see kustomization.yaml
  pools:
    - name: pool-0
      servers: 1
      storageClassName: ontap-nas
      volumesPerServer: 4
      size: 100Gi
  buckets:
    - name: thanos
      objectLock: false
  certificate:
    requestAutoCert: false
