apiVersion: v1
kind: Service
metadata:
  name: garage-s3-api
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/component: object-store
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: garage
  ports:
    - name: s3-api
      port: 3900
      targetPort: s3-api
      protocol: TCP
    - name: admin
      port: 3903
      targetPort: admin
      protocol: TCP
