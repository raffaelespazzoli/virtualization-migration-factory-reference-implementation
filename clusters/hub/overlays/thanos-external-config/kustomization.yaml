apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: thanos-minio

resources:
  - ./namespace.yaml
  - thanos-minio-route.yaml
  - rbac.yaml
  - dns-endpoints.yaml

helmCharts:
  - name: tenant
    repo: https://operator.min.io
    releaseName: thanos
    namespace: thanos-minio
    valuesFile: values.yaml
