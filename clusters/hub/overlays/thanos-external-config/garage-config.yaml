apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir     = "/var/lib/garage/data"
    db_engine    = "lmdb"

    metadata_auto_snapshot_interval = "6h"

    [s3_api]
    s3_region     = "garage"
    api_bind_addr = "[::]:3900"

    [s3_web]
    bind_addr   = "[::]:3902"
    root_domain = ".web.garage.localhost"
    index       = "index.html"

    [admin]
    api_bind_addr = "[::]:3903"
