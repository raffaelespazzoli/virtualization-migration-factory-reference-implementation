kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: thanos-minio-console
spec:
  to:
    kind: Service
    name: thanos-console
    weight: 100
  port:
    targetPort: http-console
  tls:
    termination: edge
  wildcardPolicy: None
---
kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: thanos-minio-api
spec:
  to:
    kind: Service
    name: minio
    weight: 100
  port:
    targetPort: http-minio
  tls:
    termination: edge
  wildcardPolicy: None
