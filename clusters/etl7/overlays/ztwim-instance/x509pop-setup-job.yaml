# x509pop setup Job — automates SPIRE Server patching for x509pop NodeAttestor.
#
# The SpireServer CRD does not support configuring x509pop. This Job patches
# the SPIRE Server ConfigMap (add x509pop plugin) and StatefulSet (mount root
# CA). The StatefulSet patch triggers an automatic rolling restart.
#
# Sync-wave 10 (PostSync hook): runs after all other ztwim-instance resources
# (wave 0 default) have been created, including the SpireServer StatefulSet
# and cert-manager Certificates.
#
# Prerequisites (handled by sync-wave ordering):
#   - SpireServer deployed and StatefulSet running
#   - spire-root-ca-secret exists in ZTWIM namespace (cert-manager Certificate)
#   - CREATE_ONLY_MODE=true on the operator Subscription (ztwim-operator overlay)

# ── RBAC ──────────────────────────────────────────────────────────────

apiVersion: v1
kind: ServiceAccount
metadata:
  name: x509pop-setup
  namespace: zero-trust-workload-identity-manager
  annotations:
    argocd.argoproj.io/sync-wave: "10"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: x509pop-setup
  namespace: zero-trust-workload-identity-manager
  annotations:
    argocd.argoproj.io/sync-wave: "10"
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["controllerrevisions"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: x509pop-setup
  namespace: zero-trust-workload-identity-manager
  annotations:
    argocd.argoproj.io/sync-wave: "10"
subjects:
  - kind: ServiceAccount
    name: x509pop-setup
    namespace: zero-trust-workload-identity-manager
roleRef:
  kind: Role
  name: x509pop-setup
  apiGroup: rbac.authorization.k8s.io

# ── Job ───────────────────────────────────────────────────────────────

---
apiVersion: batch/v1
kind: Job
metadata:
  name: x509pop-setup
  namespace: zero-trust-workload-identity-manager
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 600
  template:
    spec:
      serviceAccountName: x509pop-setup
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: registry.redhat.io/openshift4/ose-cli:latest
          env:
            - name: ZTWIM_NS
              value: zero-trust-workload-identity-manager
          command:
            - /bin/bash
            - -euo
            - pipefail
            - -c
            - |
              echo "=== x509pop setup Job starting ==="

              # ── Wait for prerequisites ──────────────────────────────
              echo "Waiting for spire-server StatefulSet..."
              until oc get statefulset spire-server -n "${ZTWIM_NS}" &>/dev/null; do
                echo "  StatefulSet not found yet, retrying in 10s..."
                sleep 10
              done

              echo "Waiting for spire-root-ca-secret..."
              until oc get secret spire-root-ca-secret -n "${ZTWIM_NS}" &>/dev/null; do
                echo "  Secret not found yet, retrying in 10s..."
                sleep 10
              done

              # ── Step 1: Add x509pop NodeAttestor to ConfigMap ──────
              # Patch ConfigMap FIRST (before StatefulSet) so the new
              # pods pick up the updated config on the restart triggered
              # by the StatefulSet patch in Step 2.
              echo "Checking spire-server ConfigMap for x509pop..."

              oc get configmap spire-server -n "${ZTWIM_NS}" \
                -o jsonpath='{.data.server\.conf}' > /tmp/server-conf.json

              if grep -q '"x509pop"' /tmp/server-conf.json; then
                echo "x509pop NodeAttestor already present — skipping x509pop ConfigMap patch"
              else
                echo "Adding x509pop NodeAttestor to ConfigMap..."
                X509POP='{"x509pop":{"plugin_data":{"ca_bundle_path":"/tmp/x509pop-ca/ca.crt.pem"}}}'

                # Insert x509pop into the NodeAttestor array.
                # Uses bracket-counting to find the correct closing ],
                # handling nested objects safely.
                tr '\n' '\001' < /tmp/server-conf.json | awk -v entry="${X509POP}" '{
                  s = $0
                  target = "\"NodeAttestor\""
                  idx = index(s, target)
                  if (idx > 0) {
                    rest = substr(s, idx)
                    bi = index(rest, "[")
                    if (bi > 0) {
                      abs = idx + bi - 1
                      depth = 0
                      for (i = abs; i <= length(s); i++) {
                        c = substr(s, i, 1)
                        if (c == "[") depth++
                        else if (c == "]") {
                          depth--
                          if (depth == 0) {
                            s = substr(s, 1, i-1) "," entry substr(s, i)
                            break
                          }
                        }
                      }
                    }
                  }
                  printf "%s", s
                }' | tr '\001' '\n' > /tmp/server-conf-updated.json

                # Build a properly JSON-encoded merge patch using awk.
                awk '
                  BEGIN { printf "{\"data\":{\"server.conf\":\"" }
                  {
                    gsub(/\\/, "\\\\")
                    gsub(/"/, "\\\"")
                    gsub(/\t/, "\\t")
                    gsub(/\r/, "\\r")
                    if (NR > 1) printf "\\n"
                    printf "%s", $0
                  }
                  END { print "\"}}" }
                ' /tmp/server-conf-updated.json > /tmp/cm-patch.json

                oc patch configmap spire-server -n "${ZTWIM_NS}" \
                  --type=merge --patch-file /tmp/cm-patch.json

                echo "x509pop ConfigMap patched successfully"
              fi

              # ── Step 1b: Add tpm_devid NodeAttestor to ConfigMap ──
              echo "Checking spire-server ConfigMap for tpm_devid..."
              oc get configmap spire-server -n "${ZTWIM_NS}" \
                -o jsonpath='{.data.server\.conf}' > /tmp/server-conf.json

              if grep -q '"tpm_devid"' /tmp/server-conf.json; then
                echo "tpm_devid NodeAttestor already present — skipping tpm_devid ConfigMap patch"
              else
                echo "Adding tpm_devid NodeAttestor to ConfigMap..."
                TPM_DEVID='{"tpm_devid":{"plugin_data":{"devid_ca_path":"/tmp/x509pop-ca/ca.crt.pem","endorsement_ca_path":"/tmp/x509pop-ca/endorsement-ca.pem"}}}'

                tr '\n' '\001' < /tmp/server-conf.json | awk -v entry="${TPM_DEVID}" '{
                  s = $0
                  target = "\"NodeAttestor\""
                  idx = index(s, target)
                  if (idx > 0) {
                    rest = substr(s, idx)
                    bi = index(rest, "[")
                    if (bi > 0) {
                      abs = idx + bi - 1
                      depth = 0
                      for (i = abs; i <= length(s); i++) {
                        c = substr(s, i, 1)
                        if (c == "[") depth++
                        else if (c == "]") {
                          depth--
                          if (depth == 0) {
                            s = substr(s, 1, i-1) "," entry substr(s, i)
                            break
                          }
                        }
                      }
                    }
                  }
                  printf "%s", s
                }' | tr '\001' '\n' > /tmp/server-conf-updated.json

                awk '
                  BEGIN { printf "{\"data\":{\"server.conf\":\"" }
                  {
                    gsub(/\\/, "\\\\")
                    gsub(/"/, "\\\"")
                    gsub(/\t/, "\\t")
                    gsub(/\r/, "\\r")
                    if (NR > 1) printf "\\n"
                    printf "%s", $0
                  }
                  END { print "\"}}" }
                ' /tmp/server-conf-updated.json > /tmp/cm-patch.json

                oc patch configmap spire-server -n "${ZTWIM_NS}" \
                  --type=merge --patch-file /tmp/cm-patch.json

                echo "tpm_devid ConfigMap patched successfully"
              fi

              # ── Step 2: Mount spire-root-ca-secret into spire-server ─
              # Patching spec.template triggers an automatic rolling
              # restart — no explicit rollout restart needed.
              echo "Patching spire-server StatefulSet to mount x509pop CA..."
              oc patch statefulset spire-server -n "${ZTWIM_NS}" --type=strategic --patch '
              spec:
                template:
                  spec:
                    volumes:
                    - name: x509pop-ca
                      secret:
                        secretName: spire-root-ca-secret
                        items:
                        - key: tls.crt
                          path: ca.crt.pem
                    - name: endorsement-ca
                      secret:
                        secretName: swtpm-endorsement-ca
                        optional: true
                        items:
                        - key: ca.pem
                          path: endorsement-ca.pem
                    containers:
                    - name: spire-server
                      volumeMounts:
                      - name: x509pop-ca
                        mountPath: /tmp/x509pop-ca
                        readOnly: true
                      - name: endorsement-ca
                        mountPath: /tmp/x509pop-ca/endorsement-ca.pem
                        subPath: endorsement-ca.pem
                        readOnly: true
              '

              # ── Step 3: Wait for rollout ───────────────────────────
              echo "Waiting for spire-server rollout..."
              oc rollout status statefulset/spire-server -n "${ZTWIM_NS}" --timeout=300s

              echo "Waiting for spire-server-0 to be ready..."
              oc wait --for=condition=Ready pod/spire-server-0 -n "${ZTWIM_NS}" --timeout=120s

              # ── Step 4: Verify ─────────────────────────────────────
              echo "Verifying x509pop configuration in ConfigMap..."
              oc get configmap spire-server -n "${ZTWIM_NS}" \
                -o jsonpath='{.data.server\.conf}' | grep -c x509pop
              echo "x509pop entries found in server.conf (expected >= 1)"

              echo "Verifying tpm_devid configuration in ConfigMap..."
              oc get configmap spire-server -n "${ZTWIM_NS}" \
                -o jsonpath='{.data.server\.conf}' | grep -c tpm_devid
              echo "tpm_devid entries found in server.conf (expected >= 1)"

              echo ""
              echo "=== x509pop setup Job complete ==="
