apiVersion: redhatcop.redhat.io/v1alpha1
kind: JWTOIDCAuthEngineConfig
metadata:
  name: spire-jwt-config
spec:
  authentication:
    path: etl7
    role: vault-admin
    serviceAccount:
      name: default
  path: spire-jwt/spire-jwt
  OIDCDiscoveryURL: "https://oidc-discovery.apps.${CLUSTER_BASE_DOMAIN}"
  # OIDCDiscoveryCAPEM not needed — the route uses a publicly-trusted Let's Encrypt wildcard cert
  boundIssuer: "https://oidc-discovery.apps.${CLUSTER_BASE_DOMAIN}"
  JWTSupportedAlgs:
    - RS256
  defaultRole: spire-vm-role
