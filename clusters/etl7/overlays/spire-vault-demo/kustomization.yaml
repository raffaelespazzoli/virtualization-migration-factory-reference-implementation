apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NOTE: Global "namespace:" is intentionally omitted because
# spire-server-route.yaml targets zero-trust-workload-identity-manager,
# not spire-vault-demo. Each resource sets its namespace explicitly.

resources:
  - namespace.yaml
  - cert-issuer.yaml
  - cert-bootstrap.yaml
  - spire-server-route.yaml
  - virtual-machine.yaml
  - service.yaml
  - route.yaml
