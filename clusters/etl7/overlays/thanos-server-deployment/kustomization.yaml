apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../components/thanos-server-deployment

patches:
  # etl7: Compactor STANDBY — attestation ConfigMap stays empty, replicas forced to 0
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: thanos-compactor
    patch: |
      - op: replace
        path: /spec/replicas
        value: 0
