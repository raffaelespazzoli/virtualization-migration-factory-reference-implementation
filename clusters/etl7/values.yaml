      
projects: {}

applications:  

  openshift-config:
    annotations:
      argocd.argoproj.io/sync-wave: '16'
      argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true,IgnoreExtraneous
      argocd.argoproj.io/manifest-generate-paths: ".;/components/openshift-config"
    source:
      path: clusters/etl7/overlays/openshift-config

# Networking

  nmstate-configuration:
    annotations:
      argocd.argoproj.io/sync-wave: '15'
    source:
      path: clusters/etl7/overlays/nmstate-configuration

  metallb-configuration:
    annotations:
      argocd.argoproj.io/sync-wave: '6'
      argocd.argoproj.io/manifest-generate-paths: ".;/components/metallb-configuration"
    destination:
      namespace: metallb-system
    source:
      path: clusters/etl7/overlays/metallb-configuration      

# Storage

  trident-configuration:
    annotations:
      argocd.argoproj.io/sync-wave: '6'
      argocd.argoproj.io/manifest-generate-paths: ".;/components/trident-configuration"
    destination:
      namespace: netapp-trident
    source:
      path: clusters/etl7/overlays/trident-configuration  

# Zero Trust

  ztwim-operator:
    annotations:
      argocd.argoproj.io/sync-wave: '5'
    source:
      path: components/ztwim-operator

  ztwim-instance:
    annotations:
      argocd.argoproj.io/sync-wave: '15'
      argocd.argoproj.io/manifest-generate-paths: ".;/components/ztwim-instance"
    source:
      path: clusters/etl7/overlays/ztwim-instance

  vault:
    annotations:
      argocd.argoproj.io/sync-wave: '15'
      argocd.argoproj.io/manifest-generate-paths: ".;/components/vault"
    destination:
      namespace: vault
    source:
      path: clusters/etl7/overlays/vault
    extraFields: |
      ignoreDifferences:
        - group: 'apps'
          jsonPointers:
            - /spec/volumeClaimTemplates
          kind: StatefulSet

  vault-config-operator:
    annotations:
      argocd.argoproj.io/sync-wave: '5'
    source:
      path: components/vault-config-operator
    extraFields: |
      ignoreDifferences:
        - group: ''
          kind: ConfigMap
          name: ocp-service-ca
          jsonPointers:
            - /data

  vault-spire-trust:
    annotations:
      argocd.argoproj.io/sync-wave: '25'
    source:
      path: clusters/etl7/overlays/vault-spire-trust
    extraFields: |
      ignoreDifferences:
        - group: ""
          kind: ConfigMap
          jsonPointers:
            - /data

