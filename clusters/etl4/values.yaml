      
projects: {}

applications: 

  openshift-config:
    annotations:
      argocd.argoproj.io/sync-wave: '16'
      argocd.argoproj.io/manifest-generate-paths: ".;/components/openshift-config"
    source:
      path: clusters/etl4/overlays/openshift-config

# Networking

  nmstate-configuration:
    annotations:
      argocd.argoproj.io/sync-wave: '15'
    source:
      path: clusters/etl4/overlays/nmstate-configuration

  metallb-configuration:
    annotations:
      argocd.argoproj.io/sync-wave: '6'
      argocd.argoproj.io/manifest-generate-paths: ".;/components/metallb-configuration"
    destination:
      namespace: metallb-system
    source:
      path: clusters/etl4/overlays/metallb-configuration      

# Storage

  trident-configuration:
    annotations:
      argocd.argoproj.io/sync-wave: '6'
      argocd.argoproj.io/manifest-generate-paths: ".;/components/trident-configuration"
    destination:
      namespace: netapp-trident
    source:
      path: clusters/etl4/overlays/trident-configuration          


# VDI

  vault:
    annotations:
      argocd.argoproj.io/sync-wave: '15'
      argocd.argoproj.io/manifest-generate-paths: ".;/components/vault"
    destination:
      namespace: vault      
    source:
      path: clusters/etl4/overlays/vault
    extraFields: |
      ignoreDifferences:
        - group: 'apps'
          jsonPointers:
            - /spec/volumeClaimTemplates
          kind: StatefulSet      

