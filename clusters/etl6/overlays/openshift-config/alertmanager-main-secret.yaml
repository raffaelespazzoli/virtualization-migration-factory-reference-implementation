apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-main
  namespace: openshift-monitoring
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
    inhibit_rules:
    - equal: [namespace, alertname]
      source_matchers: ['severity = critical']
      target_matchers: ['severity =~ warning|info']
    - equal: [namespace, alertname]
      source_matchers: ['severity = warning']
      target_matchers: ['severity = info']
    receivers:
    - name: Default
      webhook_configs:
      - url: http://openshift-ai-ops-backend.openshift-ai-ops.svc:8000/api/v1/webhooks/alertmanager
        send_resolved: true
    - name: Watchdog
    - name: Critical
      webhook_configs:
      - url: http://openshift-ai-ops-backend.openshift-ai-ops.svc:8000/api/v1/webhooks/alertmanager
        send_resolved: true
    route:
      group_by: [namespace]
      group_wait: 30s
      group_interval: 5m
      receiver: Default
      repeat_interval: 15m
      routes:
      - matchers: ['alertname = Watchdog']
        receiver: Watchdog
        repeat_interval: 2m
      - matchers: ['severity = critical']
        receiver: Critical