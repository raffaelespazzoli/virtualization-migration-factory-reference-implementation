apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../components/thanos-server-deployment

patches:
  # etl6: Compactor ACTIVE — attestation ConfigMap allows replicas=1
  - target:
      version: v1
      kind: ConfigMap
      name: compactor-attestation
    patch: |
      - op: add
        path: /data/attestation
        value: "I confirm that there are no other compactors running in other thanos server deployments"
