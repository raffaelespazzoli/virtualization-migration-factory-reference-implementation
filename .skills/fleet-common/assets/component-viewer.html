<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleet Component Documentation</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<style>
:root {
  --bg: #0f1419;
  --surface: #1a2028;
  --surface-alt: #222d38;
  --border: #2d3a47;
  --text: #e6edf3;
  --text-muted: #8b949e;
  --accent: #58a6ff;
  --accent-dim: #1f6feb33;
  --success: #3fb950;
  --warn: #d29922;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --mono: 'JetBrains Mono', 'Fira Code', monospace;
  --radius: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  padding: 2rem;
  max-width: 960px;
  margin: 0 auto;
}
h1 { font-size: 2rem; margin-bottom: 0.25rem; }
h2 { font-size: 1.4rem; margin: 2rem 0 0.75rem; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 0.4rem; }
h3 { font-size: 1.1rem; margin: 1.25rem 0 0.5rem; color: var(--text); }
p { margin-bottom: 0.75rem; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.meta-bar {
  display: flex; flex-wrap: wrap; gap: 0.75rem;
  margin: 0.75rem 0 1.5rem;
  font-size: 0.85rem; color: var(--text-muted);
}
.meta-bar .chip {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 0.2rem 0.6rem;
}

.section { margin-bottom: 2rem; }
.section-text p { white-space: pre-wrap; }

.config-table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; font-size: 0.9rem; }
.config-table th, .config-table td {
  padding: 0.5rem 0.75rem;
  border: 1px solid var(--border);
  text-align: left;
  vertical-align: top;
}
.config-table th { background: var(--surface-alt); color: var(--text-muted); font-weight: 600; }
.config-table td { background: var(--surface); }
.config-table code { font-family: var(--mono); font-size: 0.8rem; color: var(--success); }

table.data-table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; font-size: 0.9rem; }
table.data-table th, table.data-table td {
  padding: 0.5rem 0.75rem;
  border: 1px solid var(--border);
  text-align: left;
}
table.data-table th { background: var(--surface-alt); font-weight: 600; }
table.data-table td { background: var(--surface); }

.diagram-container {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  margin-top: 0.75rem;
  overflow-x: auto;
}
.diagram-container svg { max-width: 100%; height: auto; }

.lifecycle-parts {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 0.75rem; margin-top: 0.75rem;
}
.part-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem;
}
.part-card .name { font-family: var(--mono); font-size: 0.9rem; color: var(--accent); }
.part-card .wave { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem; }
.part-card .purpose { font-size: 0.85rem; margin-top: 0.4rem; }

.clusters-list { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
.clusters-list .cluster {
  background: var(--accent-dim);
  border: 1px solid var(--accent);
  border-radius: 4px;
  padding: 0.2rem 0.6rem;
  font-size: 0.8rem;
  font-family: var(--mono);
}

#drop-zone {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 3rem 2rem;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s;
}
#drop-zone:hover, #drop-zone.dragover { border-color: var(--accent); }
#drop-zone p { color: var(--text-muted); margin-bottom: 0.5rem; }
#file-input { display: none; }
#content { display: none; }
</style>
</head>
<body>

<div id="drop-zone">
  <p>Drop a component JSON file here or click to browse</p>
  <p style="font-size:0.8rem">Supports files generated by fleet-explain-component</p>
  <input type="file" id="file-input" accept=".json">
</div>

<div id="content"></div>

<script>
mermaid.initialize({ startOnLoad: false, theme: 'dark', themeVariables: { primaryColor: '#1f6feb', primaryTextColor: '#e6edf3', lineColor: '#58a6ff', secondaryColor: '#222d38' }});

const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const content = document.getElementById('content');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file) loadFile(file);
});
fileInput.addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });

const params = new URLSearchParams(window.location.search);
const srcParam = params.get('src');
if (srcParam) {
  fetch(srcParam)
    .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
    .then(data => render(data))
    .catch(err => { dropZone.querySelector('p').textContent = `Failed to load ${srcParam}: ${err.message}`; });
}

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      render(data);
    } catch (err) {
      alert('Invalid JSON: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function render(data) {
  dropZone.style.display = 'none';
  content.style.display = 'block';
  document.title = `${data.title || data.component} — Fleet Component`;

  let html = `<h1>${esc(data.title || data.component)}</h1>`;
  html += '<div class="meta-bar">';
  if (data.upstream?.product) html += `<span class="chip">${esc(data.upstream.product)}</span>`;
  if (data.upstream?.operator) html += `<span class="chip">operator: ${esc(data.upstream.operator)}</span>`;
  if (data.upstream?.channel) html += `<span class="chip">channel: ${esc(data.upstream.channel)}</span>`;
  if (data.generated) html += `<span class="chip">generated: ${new Date(data.generated).toLocaleDateString()}</span>`;
  html += '</div>';

  if (data.upstream?.docs_url) {
    html += `<p><a href="${esc(data.upstream.docs_url)}" target="_blank">Upstream Documentation ↗</a></p>`;
  }

  if (data.lifecycle_parts?.length) {
    html += '<h2>Lifecycle Parts</h2><div class="lifecycle-parts">';
    for (const part of data.lifecycle_parts) {
      html += `<div class="part-card"><div class="name">${esc(part.name)}</div><div class="wave">sync-wave: ${part.wave}</div><div class="purpose">${esc(part.purpose)}</div></div>`;
    }
    html += '</div>';
  }

  if (data.clusters?.length) {
    html += '<h2>Deployed In</h2><div class="clusters-list">';
    for (const c of data.clusters) html += `<span class="cluster">${esc(c)}</span>`;
    html += '</div>';
  }

  if (data.sections?.length) {
    for (const section of data.sections) {
      html += renderSection(section);
    }
  }

  content.innerHTML = html;
  renderMermaidDiagrams();
}

function renderSection(s) {
  let html = '<div class="section">';
  if (s.title) html += `<h2>${esc(s.title)}</h2>`;

  switch (s.type) {
    case 'text':
      html += `<div class="section-text"><p>${esc(s.body)}</p></div>`;
      break;

    case 'config-summary':
      if (s.body) html += `<p>${esc(s.body)}</p>`;
      if (s.values?.length) {
        html += '<table class="config-table"><thead><tr><th>Resource</th><th>Field</th><th>Value</th><th>Rationale</th></tr></thead><tbody>';
        for (const v of s.values) {
          html += `<tr><td><code>${esc(v.resource)}</code></td><td><code>${esc(v.field)}</code></td><td><code>${esc(String(v.value))}</code></td><td>${esc(v.rationale)}</td></tr>`;
        }
        html += '</tbody></table>';
      }
      break;

    case 'diagram':
      html += `<div class="diagram-container"><pre class="mermaid">${esc(s.mermaid)}</pre></div>`;
      break;

    case 'table':
      if (s.columns?.length && s.rows?.length) {
        html += '<table class="data-table"><thead><tr>';
        for (const col of s.columns) html += `<th>${esc(col)}</th>`;
        html += '</tr></thead><tbody>';
        for (const row of s.rows) {
          html += '<tr>';
          for (const cell of row) html += `<td>${esc(String(cell))}</td>`;
          html += '</tr>';
        }
        html += '</tbody></table>';
      }
      break;
  }

  html += '</div>';
  return html;
}

async function renderMermaidDiagrams() {
  const els = document.querySelectorAll('.mermaid');
  for (let i = 0; i < els.length; i++) {
    const el = els[i];
    const src = el.textContent;
    try {
      const { svg } = await mermaid.render(`mermaid-${i}`, src);
      el.outerHTML = `<div class="mermaid-rendered">${svg}</div>`;
    } catch (err) {
      el.outerHTML = `<pre style="color:var(--warn)">Diagram render error: ${esc(err.message)}\n\n${esc(src)}</pre>`;
    }
  }
}

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
